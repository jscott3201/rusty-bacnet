[package]
name = "bacnet-device-core"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Sans-IO BACnet request core: answers ReadProperty, ReadPropertyMultiple, WriteProperty, WritePropertyMultiple, Who-Is and Who-Has from an ObjectDatabase, keeps the COV subscription table and runs intrinsic event reporting, for firmware and the bacnet-server executor"
keywords = ["bacnet", "building-automation", "sans-io", "embedded", "no-std"]
categories = ["network-programming", "embedded", "no-std"]

# Without `std` the crate builds for bare-metal targets with a global
# allocator and atomic compare-and-swap, as bacnet-objects does (#2178). One
# of `std` and `alloc` is required: the database it serves boxes every
# object.
[features]
default = ["std"]
# Hosted builds: std in every dependency. It doesn't turn on bacnet-objects'
# `alloc`, so a hosted build compiles none of its no_std stand-ins.
std = [
    "bacnet-time/std",
    "bacnet-types/std",
    "bacnet-encoding/std",
    "bacnet-services/std",
    "bacnet-objects/std",
    "bytes/std",
    "structured-writes",
    "cov-multiple",
    "event-reporting",
]
# no_std with a global allocator.
alloc = [
    "bacnet-types/alloc",
    "bacnet-encoding/alloc",
    "bacnet-services/alloc",
    "bacnet-objects/alloc",
]
# WriteProperty's own decoding of three structured datatypes (#2210): a
# BACnetEventParameter, and the elements of a BACnetPortPermission or
# BACnetStageLimitValue array. `std` turns it on. Without it, a write of one
# of those values is refused with PROPERTY / WRITE_ACCESS_DENIED, and an
# image drops their decoders: about 20 KB of flash on a Cortex-M, most of
# it the event parameter decoder. The rows still call those properties
# writable, so such a build's PICS lists them as read-only.
structured-writes = []
# The SubscribeCOVPropertyMultiple path (#2320): the service and its checks
# (`cov::subscribe_cov_property_multiple`), the capture of timestamped
# changes (`cov::timed_capture`), the timestamped histories with their
# claims and deadlines (`cov::timed`), and what a fanout reports to each
# context, split to the subscriber's APDU size (`cov::multiple_report`).
# With it the `Reporter` answers the service and sends its reports
# (`report::NotifyService::CovMultiple`). `std` turns it on, so
# bacnet-server has it; a firmware image built on `alloc` leaves it off
# unless it serves that service. The `Reporter` dispatches by service, so
# the path links whether or not anyone subscribes through it: measured on
# the `reporting` image it costs about 134 KB of flash on a Cortex-M3 and
# 12 KiB of heap, with three 64-bit division routines, until its B-tree
# maps and sorts are trimmed (#2215's rule for keeping a feature; design
# note, decision 18).
cov-multiple = []
# Intrinsic event reporting (#2303): the `event` module, with the
# timestamps, message text, Event Values and distribution profile of a
# committed transition. It turns on bacnet-objects' `event-reporting`, so
# the objects lend their detectors. `std` turns it on, so bacnet-server has
# it; no firmware image does yet.
event-reporting = ["bacnet-objects/event-reporting"]
# Hidden hooks for hosts' own tests (the COV table's generation counter, so
# bacnet-server's table tests reach generation exhaustion, an event payload
# built without a projection, and GetEventInformation within a byte budget).
# bacnet-server turns it on for its tests only, through a dev-dependency;
# never enable it in a product build.
test-support = []

# The release that first publishes this crate. Until the website names that
# release, its crate map links the source here instead of docs.rs (#1989).
[package.metadata.website]
first-release = "0.16.0"

[package.metadata.docs.rs]
no-default-features = true
features = ["std"]
default-target = "x86_64-unknown-linux-gnu"
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bacnet-time = { workspace = true }
bacnet-types = { workspace = true }
bacnet-encoding = { workspace = true }
bacnet-services = { workspace = true }
bacnet-objects = { workspace = true }
bytes = { workspace = true }

[lints]
workspace = true
