[package]
name = "bacnet-mstp-codec"
description = "Portable no-std BACnet MS/TP frame codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["bacnet", "mstp", "embedded", "no-std"]
categories = ["embedded", "network-programming", "no-std", "no-std::no-alloc"]

# No feature needs std. Each adds a FrameSink impl, except crc32k-table,
# which computes the CRC-32K from a 1 KiB table instead of a 64-octet one.
[features]
default = []
alloc = []
bytes = ["alloc", "dep:bytes"]
heapless = ["dep:heapless"]
crc32k-table = []

[dependencies]
bytes = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[package.metadata.docs.rs]
# Every feature, and a bare-metal target too, so the docs show each sink
# and the crate without std; --cfg docsrs labels feature-gated items.
all-features = true
targets = ["x86_64-unknown-linux-gnu", "thumbv7em-none-eabihf"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
