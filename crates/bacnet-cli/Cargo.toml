[package]
name = "bacnet-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "BACnet command-line tool for device discovery, reading, and writing"
keywords = ["bacnet", "building-automation", "cli", "hvac"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "bacnet"
path = "src/main.rs"

[dependencies]
bacnet-types = { workspace = true, features = ["std"] }
bacnet-encoding = { workspace = true, features = ["std"] }
bacnet-services = { workspace = true, features = ["std"] }
bacnet-transport = { workspace = true, features = ["ipv6"] }
bacnet-network.workspace = true
bacnet-client = { workspace = true, features = ["ipv6"] }
bytes = { workspace = true, features = ["std"] }
tracing.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "macros", "time", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comfy-table = "7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustyline = "18"

# SC-TLS optional deps
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { version = "1", optional = true }

# Pcap optional deps
pcap = { version = "2", optional = true }
ctrlc = { version = "3", optional = true }
libc = { version = "0.2", optional = true }
owo-colors = "4.3.0"
if-addrs = "0.15"

# Terminal UI (`bacnet tui`). ratatui without its calendar widget (which pulls
# in the `time` crate), macros, or `underline-color`, whose weak references to
# the other backends would lock about 60 crates that are never built.
# crossterm is the version ratatui re-exports; it is named here only to turn
# on `event-stream`, and the code imports it as `ratatui::crossterm`.
ratatui = { version = "0.30.2", optional = true, default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = { version = "0.29", optional = true, features = ["event-stream"] }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
bacnet-objects.workspace = true
bacnet-server.workspace = true
rcgen.workspace = true
futures-util.workspace = true
insta = "1.48"
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
# The full-screen terminal UI (`bacnet tui`). Opt-in until the TUI epic ships in
# 0.14.0 (#975): release builds and a plain `cargo install` leave it out.
tui = ["dep:ratatui", "dep:crossterm", "dep:futures-util"]
sc-tls = [
    "bacnet-client/sc-tls",
    "bacnet-transport/sc-tls",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-pki-types",
]
pcap = ["dep:pcap", "dep:ctrlc", "dep:libc"]

[lints]
workspace = true
