[package]
name = "bacnet-endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "BACnet endpoint that owns one transport and runs client and server roles through it"
keywords = ["bacnet", "building-automation", "client", "server", "async"]
categories = ["network-programming"]
readme = "README.md"

[package.metadata.docs.rs]
no-default-features = true
features = ["sc-tls"]
default-target = "x86_64-unknown-linux-gnu"
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bacnet-npdu = { workspace = true }
bacnet-types = { workspace = true, features = ["std"] }
bacnet-encoding = { workspace = true, features = ["std"] }
bacnet-services = { workspace = true, features = ["std"] }
bacnet-transport.workspace = true
bacnet-network.workspace = true
bacnet-endpoint-core.workspace = true
bacnet-client.workspace = true
# The source Reporter hands both capability features' accessors on to the
# object it wraps (#2215); `std` implies them.
bacnet-objects = { workspace = true, features = ["std", "event-reporting", "durable-writes"] }
bacnet-device-core = { workspace = true, features = ["std"] }
# The COV Reporter's timeline is Tokio's clock (#2490).
bacnet-time = { workspace = true, features = ["std"] }
bacnet-server.workspace = true
bytes = { workspace = true, features = ["std"] }
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "net"] }
tokio-rustls = { workspace = true, optional = true }

[features]
sc-tls = [
    "bacnet-transport/sc-tls",
    "bacnet-client/sc-tls",
    "bacnet-server/sc-tls",
    "dep:tokio-rustls",
]

[dev-dependencies]
# The B/IPv6 Network Port tests run on a real Bip6Transport (#1940); the
# dedicated-thread MS/TP tests run their node on the test's paused time
# (`test-support`, #2284).
bacnet-transport = { workspace = true, features = ["ipv6", "test-support"] }
socket2.workspace = true
tokio-tungstenite.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util", "net"] }
rcgen.workspace = true
futures-util.workspace = true
tokio-rustls.workspace = true
# The instants the forwarding probe and intrinsic tests pass to event
# reporting (#2303).
bacnet-time.workspace = true
rustls.workspace = true

[lints]
workspace = true
