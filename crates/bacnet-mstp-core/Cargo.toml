[package]
name = "bacnet-mstp-core"
description = "Portable allocation-bounded BACnet MS/TP master core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["bacnet", "mstp", "embedded", "no-std"]
categories = ["embedded", "network-programming", "no-std", "no-std::no-alloc"]

# No feature needs std. `alloc` adds AllocQueues; HeaplessQueues, which
# keeps its slots in arrays, needs no feature.
[features]
default = []
alloc = []

[dependencies]
bacnet-mstp-codec = { workspace = true, default-features = false }
bacnet-time = { workspace = true }

[dev-dependencies]
proptest.workspace = true

[package.metadata.docs.rs]
# Every feature, and a bare-metal target too, so the docs show AllocQueues
# and the crate without std; --cfg docsrs labels feature-gated items.
all-features = true
targets = ["x86_64-unknown-linux-gnu", "thumbv7em-none-eabihf"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
