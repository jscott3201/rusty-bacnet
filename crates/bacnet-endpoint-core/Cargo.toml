[package]
name = "bacnet-endpoint-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared BACnet endpoint ownership and transaction coordination"
readme = "README.md"

[package.metadata.docs.rs]
no-default-features = true
features = []
default-target = "x86_64-unknown-linux-gnu"
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bacnet-npdu = { workspace = true }
bacnet-types = { workspace = true, features = ["std"] }
bacnet-encoding = { workspace = true, features = ["std"] }
bacnet-transport.workspace = true
bacnet-network.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
bytes = { workspace = true, features = ["std"] }

[lints]
workspace = true
