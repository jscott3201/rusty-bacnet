[package]
name = "bacnet-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "UI-free BACnet operations core shared by the bacnet CLI, its TUI and its MCP server"
keywords = ["bacnet", "building-automation", "hvac"]
categories = ["network-programming"]

[package.metadata.docs.rs]
no-default-features = true
features = ["sc-tls"]
default-target = "x86_64-unknown-linux-gnu"
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bacnet-types = { workspace = true, features = ["std", "qudt"] }
bacnet-encoding = { workspace = true, features = ["std"] }
bacnet-services = { workspace = true, features = ["std"] }
bacnet-transport = { workspace = true, features = ["ipv6"] }
bacnet-client = { workspace = true, features = ["ipv6"] }
bytes = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
bacnet-objects = { workspace = true, features = ["std"] }
bacnet-server.workspace = true
bacnet-transport = { workspace = true, features = ["test-support"] }
# The text-form round trips of the parsers (`parse::rdf_tests`).
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[features]
# The BACnet/SC transport, passed through to the layers below.
sc-tls = ["bacnet-transport/sc-tls", "bacnet-client/sc-tls"]
# The 223 export's structural check (`export::s223::testing`), for the MCP
# tool's tests. Not a stable API.
test-support = []

[lints]
workspace = true

# The release that first publishes this crate. Until the website names that
# release, its crate map links the source here instead of docs.rs (#1989).
[package.metadata.website]
first-release = "0.15.0"
