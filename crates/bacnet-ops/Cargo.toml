[package]
name = "bacnet-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "UI-free BACnet operations core shared by the bacnet CLI, its TUI and its MCP server"
keywords = ["bacnet", "building-automation", "hvac"]
categories = ["network-programming"]

[package.metadata.docs.rs]
no-default-features = true
features = ["sc-tls", "serial"]
default-target = "x86_64-unknown-linux-gnu"
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bacnet-types = { workspace = true, features = ["std", "qudt"] }
bacnet-encoding = { workspace = true, features = ["std"] }
bacnet-npdu.workspace = true
bacnet-services = { workspace = true, features = ["std"] }
bacnet-transport = { workspace = true, features = ["ipv6"] }
bacnet-client = { workspace = true, features = ["ipv6"] }
bytes = { workspace = true, features = ["std"] }
# The `Stream` a watch is (`watch::Watch`); the trait alone.
futures-core.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
futures-util.workspace = true
# The in-process router behind which the handle tests' routed stations sit.
bacnet-network.workspace = true
bacnet-objects = { workspace = true, features = ["std"] }
bacnet-server.workspace = true
bacnet-transport = { workspace = true, features = ["test-support"] }
# The text-form round trips of the parsers (`parse::rdf_tests`).
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[features]
# The BACnet/SC transport, passed through to the layers below, and the
# `Client::sc` connect builder.
sc-tls = ["bacnet-transport/sc-tls", "bacnet-client/sc-tls"]
# MS/TP over a serial port: the `Client::mstp` connect builder.
serial = ["bacnet-transport/serial"]
# The 223 export's structural check and shared decode frame builders,
# for front-end tests. Not a stable API.
test-support = []

[lints]
workspace = true

# The release that first publishes this crate. Until the website names that
# release, its crate map links the source here instead of docs.rs (#1989).
[package.metadata.website]
first-release = "0.15.0"
