[package]
name = "bacnet-server"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "BACnet server: APDU dispatch and service handlers"
keywords = ["bacnet", "building-automation", "server", "async"]
categories = ["network-programming"]

[package.metadata.docs.rs]
no-default-features = true
features = ["sc-tls"]
default-target = "x86_64-unknown-linux-gnu"
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bacnet-npdu = { workspace = true }
bacnet-types = { workspace = true, features = ["std"] }
bacnet-encoding = { workspace = true, features = ["std"] }
bacnet-endpoint-core.workspace = true
bacnet-services = { workspace = true, features = ["std"] }
bacnet-transport.workspace = true
bacnet-network.workspace = true
# It drives both capability features (#2215): intrinsic and algorithmic
# reporting, and staged durable writes. `std` implies them; they're named
# so the server keeps them if that changes.
bacnet-objects = { workspace = true, features = ["std", "event-reporting", "durable-writes"] }
bacnet-device-core = { workspace = true, features = ["std"] }
bacnet-time = { workspace = true, features = ["std"] }
bytes = { workspace = true, features = ["std"] }
futures-util.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "macros", "time"] }
tokio-rustls = { workspace = true, optional = true }

[features]
sc-tls = ["bacnet-transport/sc-tls", "dep:tokio-rustls"]
# Hooks for another crate's tests: the count of network-number controls that
# asked for the database's write guard (#2507). Not for production builds.
test-support = []

[dev-dependencies]
rcgen.workspace = true
# The COV table's test hooks, for the table tests (#2303).
bacnet-device-core = { workspace = true, features = ["std", "test-support"] }
bacnet-client.workspace = true
bacnet-transport = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "macros", "time", "test-util"] }

[lints]
workspace = true
