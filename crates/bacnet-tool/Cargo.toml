[package]
name = "bacnet-tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "The bacnet tool's own layer over bacnet-ops: write safety, command classes, frame decoding and the BBMD survey"
keywords = ["bacnet", "building-automation", "hvac"]
categories = ["network-programming"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bacnet-ops.workspace = true
bacnet-types = { workspace = true, features = ["std"] }
bacnet-encoding = { workspace = true, features = ["std"] }
bacnet-services = { workspace = true, features = ["std"] }
bacnet-transport = { workspace = true, features = ["ipv6"] }
bacnet-client = { workspace = true, features = ["ipv6"] }
bacnet-npdu.workspace = true
bytes = { workspace = true, features = ["std"] }
futures-util.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

# The errno values that mean a filesystem can't sync a directory, which a
# workspace save counts as synced (`safety::file`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
bacnet-objects = { workspace = true, features = ["std"] }
bacnet-transport = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"

[features]
# Frame builders for decode tests (`decode::testing`), for the CLI's
# capture tests. Not a stable API.
test-support = []

[lints]
workspace = true

# The release that first publishes this crate. Until the website names that
# release, its crate map links the source here instead of docs.rs (#1989).
[package.metadata.website]
first-release = "0.16.0"
