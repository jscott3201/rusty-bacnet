[package]
name = "bacnet-objects"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "BACnet object model: traits, database, and standard object types"
keywords = ["bacnet", "building-automation", "objects", "ashrae"]
categories = ["network-programming", "no-std"]

# Without `std` the crate builds for bare-metal targets with a global
# allocator and atomic compare-and-swap (#1615): every object type, the
# database and the persistence traits. One of `std` and `alloc` is required;
# the crate boxes every object.
[features]
default = ["std"]
# Hosted builds: the file persistence backends, the save writer's own thread,
# tracing, std's hash maps and std's mutex, and every capability feature
# below. It doesn't turn on `alloc`, so a hosted build compiles none of the
# no_std stand-ins below; with both on, `std` wins and they go unused.
std = [
    "bacnet-types/std",
    "bacnet-encoding/std",
    "bytes/std",
    "dep:tracing",
    "dep:libc",
    "event-reporting",
    "durable-writes",
]
# Capability features (#2215). Each one lets the built-in objects lend a
# capability through its `BACnetObject` accessors; with it off, those
# accessors answer `None`, as for an object without the behaviour, and the
# code only they reach drops out of a firmware image. `std` turns them all
# on, so hosted builds are unchanged; a no_std build with `alloc` gets none
# unless it asks. The object types, their properties and the capability
# traits are the same either way.
#
# `event-reporting`: `event_reporting()`/`event_reporting_mut()` and
# `enrollment_eval()`/`enrollment_eval_mut()`, so intrinsic reporting, the
# Event and Alert Enrollments' transitions and the logs' buffer-ready
# reports. The event properties still read and write. It also gates keeping
# the reporting settings peers write on the analog, binary and multi-state
# objects, Access Door and Zone, and Event and Alert Enrollment (#2331), and
# their written Description (#2364), and the analog, binary and multi-state
# objects', Access Door's, Access Zone's and Event Enrollment's written
# event algorithm parameters (#2331):
# `with_reporting_persistence`, the
# analog, binary and multi-state objects' three setters
# (`set_notification_class`, `set_event_enable`, `set_notify_type`),
# `written_reporting`, `clear_written_reporting` and
# `wait_for_reporting_saves`.
event-reporting = []
# `durable-writes`: `durable_writes()`, the staged saves a host makes off
# the database lock. Off, a write to an object with storage saves on the
# writer's own path, as one nobody staged does, and the built-in objects
# don't implement `DurableWrites` at all: an object's staging code is not
# compiled, which keeps it out of a firmware image (#2538).
durable-writes = []
# no_std with a global allocator. Saves run on the caller's thread, and the
# hash maps, locks and float rounding come from hashbrown, spinning_top and
# libm. A hosted application wants `std`: this one drops the file backends,
# the writer thread, the wall-clock expiry of staged writes and tracing.
alloc = [
    "bacnet-types/alloc",
    "bacnet-encoding/alloc",
    "dep:hashbrown",
    "dep:libm",
    "dep:spinning_top",
]
# Not a stable API: the file backends' in-memory mode
# (`durable::MemoryFiles`, hidden), for the restore fuzz targets in
# `fuzz/`, which then decode from memory without the file system (#2233).
# A backend in that mode writes nothing to disk, so its state is lost when
# the process ends: never enable this in a product build.
test-support = ["std"]

[package.metadata.docs.rs]
no-default-features = true
features = ["std"]
default-target = "x86_64-unknown-linux-gnu"
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# The instants intrinsic reporting's delays are due at (#2303).
bacnet-time = { workspace = true }
bacnet-types = { workspace = true }
bacnet-encoding = { workspace = true }
bytes = { workspace = true }
hashbrown = { workspace = true, optional = true }
libm = { workspace = true, optional = true }
spinning_top = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

# Its sweep drives event transitions through the objects' event reporting
# before it writes (#2215).
[[test]]
name = "write_property_clocked"
path = "tests/write_property_clocked.rs"
required-features = ["event-reporting"]

# A staged request's memory, measured by an allocator of its own (#2414).
[[test]]
name = "staged_memory"
path = "tests/staged_memory.rs"
required-features = ["event-reporting", "durable-writes"]

# What making a staged request's writes copies, counted the same way (#2526).
[[test]]
name = "staged_commit_copies"
path = "tests/staged_commit_copies.rs"
required-features = ["event-reporting", "durable-writes"]

[lints]
workspace = true
