[package]
name = "bacnet-objects"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "BACnet object model: traits, database, and standard object types"
keywords = ["bacnet", "building-automation", "objects", "ashrae"]
categories = ["network-programming"]

[package.metadata.docs.rs]
no-default-features = true
features = []
default-target = "x86_64-unknown-linux-gnu"
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bacnet-types = { workspace = true, features = ["std"] }
bacnet-encoding = { workspace = true, features = ["std"] }
bytes = { workspace = true, features = ["std"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
