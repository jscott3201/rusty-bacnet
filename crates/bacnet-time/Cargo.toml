[package]
name = "bacnet-time"
description = "The no-std monotonic Instant and Duration, in nanoseconds, that the portable BACnet cores share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["bacnet", "time", "embedded", "no-std"]
categories = ["embedded", "no-std", "no-std::no-alloc", "date-and-time"]

# No dependencies and no features: two Copy types over a u64, which build on
# bare-metal targets without an allocator.
[dependencies]

[dev-dependencies]
proptest.workspace = true

[package.metadata.docs.rs]
# Built for a bare-metal target too, so the docs show the crate without std.
# It has no features; all-features and --cfg docsrs keep it in step with
# the other no_std crates.
all-features = true
targets = ["x86_64-unknown-linux-gnu", "thumbv7em-none-eabihf"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
