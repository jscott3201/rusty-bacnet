[package]
name = "bacnet-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "BACnet network layer: routing, router tables, priority channels"
keywords = ["bacnet", "building-automation", "network", "routing"]
categories = ["network-programming"]
readme = "README.md"

[package.metadata.docs.rs]
no-default-features = true
features = []
default-target = "x86_64-unknown-linux-gnu"
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bacnet-npdu = { workspace = true }
bacnet-types = { workspace = true, features = ["std"] }
bacnet-encoding = { workspace = true, features = ["std"] }
bacnet-transport.workspace = true
bacnet-router-core.workspace = true
bacnet-time = { workspace = true, features = ["std"] }
bytes = { workspace = true, features = ["std"] }
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
# The random wait before a node's Network-Number-Is answer (#2597); the
# transports draw from it already.
getrandom = { workspace = true }

[features]
# A hook for tests, this crate's and other crates': fixed waits before a
# node's Network-Number-Is answer in place of random ones (#2597). Not for
# production builds.
test-support = []

[dev-dependencies]
bacnet-transport = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
