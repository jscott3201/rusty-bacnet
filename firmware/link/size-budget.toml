# Size budget for the firmware link test's images (#1626, #1635, #1664,
# #1667, #1679, #1771), in octets: one table per target and image,
# `[<target>.<image>]`.
# scripts/ci/check-firmware-link.sh builds the images with the `firmware`
# profile and fails when a size outgrows its budget, or when more core::fmt
# functions are linked in than `fmt_functions` allows, or more 64-bit
# division routines than `div64_functions` allows.
#
# - text, rodata, data, bss: those sections.
# - flash: every loaded section with contents, .data's initial image
#   included (on Cortex-M, also the 1 KB or 192 B vector table).
# - ram: every loaded writable section; riscv-rt's .stack, which fills
#   whatever RAM is left, doesn't count, but its .heap (`_heap_size`, 0
#   here) does. The apdu image's heap is a 1 KiB static arena in .bss
#   (`firmware_link::apdu::ARENA`). The stack the code uses at run time
#   isn't counted here: the manual emulation check measures it and holds it
#   to firmware/link/stack-budget.toml (docs/ci.md, "Emulation (manual)").
# - fmt_functions, div64_functions, memmove_functions: counts of functions,
#   not octets. The first two are 0 for every image. A 64-bit
#   division by a runtime value links compiler-builtins' routine, about
#   0.9 KB, which the 12% headroom would otherwise absorb; the MS/TP core
#   divides in 32 bits (#1618). The apdu image's counts are what it links
#   today, with no headroom, so a new function fails the check, and a count
#   under its limit gets a notice to lower the limit. Its decoders' errors
#   carry static labels, formatted only when displayed (#1646), which the
#   image never does, and since #1777 so do its encoders' validation errors,
#   so it links no core::fmt either. Before #1646 it was 15, and on ARMv6-M,
#   which has no multiply with a 64-bit product, formatting a decoded u64 also
#   linked the 64-bit division routine (3 functions); now none.
# - memmove_functions counts compiler-builtins' memmove and the entry points
#   in front of it (memmove, __aeabi_memmove, __aeabi_memmove4 and 8),
#   0.8-1.4 KB in all, which a whole-value copy the compiler can't prove
#   doesn't overlap, or a slice rotation, links. bip, node, bbmd, mstp,
#   mstp-extended and router link none, so a copy that brings it back fails
#   the check.
#   apdu links it (2); its limit is that count, with no headroom.
#
# The totals go by section flags, not memory regions, and leave out the
# alignment gaps between sections (at most 4 octets of flash per image today).
#
# Each budget is the size measured when it was set plus 12%, rounded up to
# 16 octets: what `check-firmware-link.sh --suggest` prints. .data is empty,
# so it gets a token 64 octets: a static with a nonzero initial value lands
# there, and costs flash for its initial image as well as RAM. Raising a
# budget is a reviewed change: say why the image grew. Re-measure after a
# toolchain bump. See docs/ci.md, "Firmware link test", and firmware_size.py
# for the syntax this file may use.
#
# Measured 2026-10-11 with Rust 1.99.0, as text / rodata / data / bss, then
# flash / ram:
#
#   thumbv7m mstp     17852 / 1060 / 0 /  5544   19936 /  5544
#   thumbv7m bip       8936 /  976 / 0 /   132   10936 /   132
#   thumbv6m mstp     18684 / 1060 / 0 /  5544   19936 /  5544
#   thumbv6m bip      10468 /  980 / 0 /   132   11640 /   132
#   riscv32imc mstp   19592 / 1348 / 0 /  5544   20962 /  5544
#   riscv32imc bip    11820 / 1524 / 0 /   132   13366 /   132
#   thumbv7m apdu     37404 / 5188 / 0 /  1056   43616 /  1056
#   thumbv6m apdu     39796 / 5188 / 0 /  1056   45176 /  1056
#   riscv32imc apdu   45236 / 5832 / 0 /  1056   51090 /  1056
#
# 2026-10-20 (#941): a B/IP-M member's directed broadcast stays a group
# address in bacnet-bip-core, and a link refuses a group outside NORMAL
# mode. Flash grew by up to 0.41 KB (node -20 to +208, bbmd +204 to +404,
# router +72 to +256 octets across the four targets) and the router's RAM
# by 8 octets; every image stays within its budget, so no budget changed.
#
# 2026-10-20 (#941, part 2): a BBMD may serve its multicast group, with the
# BDT's all-ones own-row rule (Bdt::set_serves_group) that BbmdPort::new
# sets from its link. Flash, measured against the parent commit with the
# same toolchain: bbmd +16 to +160 octets (riscv32imc +16, thumbv7m +140,
# thumbv6m and thumbv7em +160), router +76 to +132; the other images and
# all RAM unchanged. Every image stays within its budget; no budget changed.
#
# The bip rows were measured again on 2026-10-11, same toolchain, when the
# image gained the B/IPv6 codec's scenario (#1621): about 4.6-6.0 KB more
# flash, the RAM unchanged. The mstp rows were too, when the master core
# began waiting for a quiet line before each send (#1618, #1625), and again
# when the core began borrowing its large buffers, dropped its control
# ring and its 64-bit divisions, and the image switched to building the
# core on the stack (#1617, #1618): 2.3-2.8 KB less text and 8,952 octets
# less RAM. They were again when the codec gained extended frames, whose
# COBS and CRC-32K code the stream decoder and encoder can reach, and the
# counted skip of dropped frames (#1611, #1609): 1.4-1.8 KB more flash and
# the RAM unchanged. The CRC-32K's 1 KiB table (the codec's `crc32k-table`
# feature) would add about 0.95 KB more. The apdu rows are from when that
# image was added (#1635), measured again on 2026-10-12, same toolchain,
# when the service decoders stopped building their context labels on
# success (#1645): 100-124 octets less text, the counts unchanged.
#
# The apdu rows were measured again on 2026-10-18, same toolchain, when the
# decoders' errors became static labels (#1646), as text / rodata /
# flash, against dev at a7145abc built the same way, then after, merged
# with dev at d930e28e:
#
#   thumbv7m apdu     39216 / 5192 / 45432   38520 / 5100 / 44644
#   thumbv6m apdu     41652 / 5192 / 47036   41112 / 5100 / 46404
#   riscv32imc apdu   47600 / 5736 / 53358   46216 / 5648 / 51886
#   thumbv7em apdu    39136 / 5192 / 45352   38396 / 5100 / 44520
#
# fmt_functions dropped from 15 to 12 on every target and div64_functions
# from 3 to 0 on thumbv6m; those limits and the rodata budgets are the new
# counts and sizes plus 12%. The text and flash budgets stay as they were:
# the sizes plus 12% would be looser.
#
# apdu's fmt_functions dropped from 12 to 11 on every target when
# bacnet-encoding's owned NPDU began decoding through bacnet-npdu's view
# (#1770): its address field no longer formats itself.
#
# apdu's fmt_functions dropped from 11 to 0 on every target, measured
# 2026-10-18 with the same toolchain, when the owned APDU and NPDU encoders'
# validation refusals became static range errors and ObjectIdentifier's
# encoder lost its formatted assertions (#1777): 2.9-4.0 KB less flash.
# Checking each character set's structure in the borrowed CharacterString
# view (#1778) then added 0.2-0.5 KB of flash to the apdu and device images.
# The apdu text, rodata and flash budgets are the sizes after both, measured
# 2026-10-18, plus 12%; the device budgets absorb its growth.
#
# The bbmd image grew when the BBMD core learned NAT traversal (#940), which
# adds the NAT checks to the BDT and the origin choice to the forwarding
# decisions the image links. Measured 2026-10-20, same toolchain, bbmd .text
# against dev at 93125c06: thumbv7m 10052 -> 10212 (+160), thumbv6m
# 11812 -> 12188 (+376), riscv32imc 12684 -> 13044 (+360), thumbv7em
# 9988 -> 10200 (+212); RAM unchanged. The budgets are unchanged.
#
# The thumbv7em-none-eabihf (Cortex-M4F) rows are from when that target
# joined the check, on 2026-10-12, same toolchain (#1660). Its images are
# a little smaller than thumbv7m's:
#
#   thumbv7em mstp    17724 / 1060 / 0 /  5544   19808 /  5544
#   thumbv7em bip      8872 /  976 / 0 /   132   10872 /   132
#   thumbv7em apdu    37316 / 5188 / 0 /  1056   43528 /  1056
#
# The mstp-extended, node and bbmd rows are from when those images joined,
# on 2026-10-12, same toolchain (#1664, #1667):
#
#   thumbv7m mstp-extended     17636 /  984 / 0 /  7712   19644 /  7712
#   thumbv6m mstp-extended     18676 /  984 / 0 /  7712   19852 /  7712
#   riscv32imc mstp-extended   19440 / 1224 / 0 /  7712   20686 /  7712
#   thumbv7em mstp-extended    17596 /  984 / 0 /  7712   19604 /  7712
#   thumbv7m node              12184 /  288 / 0 /    64   13496 /    64
#   thumbv6m node              13768 /  296 / 0 /    64   14256 /    64
#   riscv32imc node            13828 /  720 / 0 /    64   14570 /    64
#   thumbv7em node             12076 /  288 / 0 /    64   13388 /    64
#   thumbv7m bbmd               8480 /  324 / 0 /   240    9828 /   240
#   thumbv6m bbmd              10176 /  324 / 0 /   240   10692 /   240
#   riscv32imc bbmd            10560 /  692 / 0 /   240   11274 /   240
#   thumbv7em bbmd              8436 /  324 / 0 /   240    9784 /   240
#
# The mstp-extended image's .bss is the core's storage alone, 7,712 octets:
# 1,516 of receive storage, FixedQueues<1, 1, 1497> and
# ExtendedActionBuffers<1>. Each more queue slot would add about 1.5 KB.
# The bbmd rows on thumbv6m are after bacnet-bip-core stopped copying a
# 6-octet B/IP address whole into a BDT or FDT row, which linked
# compiler-builtins' 1.3 KB memmove there (#1667): 1,288 octets less text
# than the 11,464 it measured before. Adding the three images left the
# other images' code as it was: each of their functions is the size it
# was, and their .text moved by at most 4 octets of alignment between
# functions. The node rows are after the node engine stopped rotating its
# queued events with rotate_left, which linked memmove on every target
# (#1667), and after the scenario stopped moving its node and summary into
# the struct that drives them: 1.2-1.4 KB less text on Cortex-M and 0.9 KB
# on RISC-V than the 13400 / 15140 / 14720 / 13304 first measured.
#
# The mstp and mstp-extended rows were measured again on 2026-10-12, same
# toolchain, when the codec's stream decoder stopped shifting its buffer,
# the queues stopped shifting their slots and the core stopped copying a
# queued NPDU onto its stack (#1691). Neither image links memmove any more.
# Against dev before that change (8042aef0), built the same way, which
# linked three memmove routines on Cortex-M (memmove itself,
# __aeabi_memmove and __aeabi_memmove8) and two on RISC-V (memmove and its
# C entry point), .text is smaller by, on thumbv7m / thumbv6m / riscv32imc
# / thumbv7em:
#
#   mstp            1656 / 1440 /  956 / 1572
#   mstp-extended   2108 / 1992 / 1388 / 2068
#
# .rodata and RAM are unchanged. compiler-builtins' memmove accounts for
# most of it; in the mstp image, the queues' slot code and the decoder's
# start offset add 0.15-0.4 KB to the core and the codec together. The
# budgets are these sizes plus 12%, as text / flash:
#
#   thumbv7m mstp              16448 / 18532
#   thumbv6m mstp              17596 / 18848
#   riscv32imc mstp            19048 / 20394
#   thumbv7em mstp             16416 / 18500
#   thumbv7m mstp-extended     15528 / 17536
#   thumbv6m mstp-extended     16684 / 17860
#   riscv32imc mstp-extended   18052 / 19298
#   thumbv7em mstp-extended    15528 / 17536
#
# The mstp and mstp-extended rows were measured again on 2026-10-13, same
# toolchain, after the codecs' API pass (#1684), which among other things
# made the MS/TP FrameType a one-octet newtype in place of an enum with a
# catch-all variant. .text changed by, on thumbv7m / thumbv6m / riscv32imc
# / thumbv7em:
#
#   mstp            -196 /  +52 / -352 / -228
#   mstp-extended   -424 / -244 / -336 / -424
#
# .rodata and RAM are unchanged, and so are the B/IP images. The text and
# flash budgets are these sizes plus 12%, as text / flash:
#
#   thumbv7m mstp              16252 / 18336
#   thumbv6m mstp              17648 / 18900
#   riscv32imc mstp            18696 / 20042
#   thumbv7em mstp             16188 / 18272
#   thumbv7m mstp-extended     15104 / 17112
#   thumbv6m mstp-extended     16440 / 17616
#   riscv32imc mstp-extended   17716 / 18962
#   thumbv7em mstp-extended    15104 / 17112
#
# The mstp and mstp-extended rows were measured again on 2026-10-13, same
# toolchain, after the MS/TP core's API pass (#1684): the images take their
# counters with take_counters, which also starts them again; the core counts
# receive errors and transmit aborts by kind; each call holds a clock that
# steps back at the latest time; and the queues' counters lost
# drops_starved. .text changed by, on thumbv7m / thumbv6m / riscv32imc /
# thumbv7em:
#
#   mstp             +92 /  -72 /  +60 /  +72
#   mstp-extended     +4 /  -44 / -112 /  +16
#
# .rodata and .bss are 16 octets smaller on every target. The budgets are
# these sizes plus 12%, as text / rodata / bss / flash:
#
#   thumbv7m mstp              16344 / 1044 / 5528 / 18412
#   thumbv6m mstp              17576 / 1044 / 5528 / 18812
#   riscv32imc mstp            18756 / 1308 / 5528 / 20086
#   thumbv7em mstp             16260 / 1044 / 5528 / 18328
#   thumbv7m mstp-extended     15108 /  968 / 7696 / 17100
#   thumbv6m mstp-extended     16396 /  968 / 7696 / 17556
#   riscv32imc mstp-extended   17604 / 1208 / 7696 / 18834
#   thumbv7em mstp-extended    15120 /  968 / 7696 / 17112
#
# The router rows are from when that image joined, on 2026-10-13, same
# toolchain (#1679), as text / rodata / data / bss, then flash / ram:
#
#   thumbv7m router     42804 / 1320 / 0 / 15504   45148 / 15504
#   thumbv6m router     46136 / 1328 / 0 / 15504   47656 / 15504
#   riscv32imc router   49392 / 1952 / 0 / 15504   51366 / 15504
#   thumbv7em router    42544 / 1320 / 0 / 15504   44888 / 15504
#
# Its .bss is one static of 15,504 octets: the router's Storage<2, 8, 8, 4>
# (3,216: a 1,497-octet scratch, a table of 8 routes and 8 hold-down
# records, 4 searches, the output queue and the counters); the MS/TP
# core's receive storage (1,516), FixedQueues<1, 2, 1497> (4,688) and
# ExtendedActionBuffers<1> (3,028); the B/IP socket's two datagram buffers
# (2 x 1,507); and where the BBMD writes a decision's destinations (40).
# The BBMD port holds no broadcasts: only a foreign device's port does. The
# rows are after bacnet-router-core stopped shifting and compacting its
# arrays with copies, which linked memmove on every target (#1679): 1,444 /
# 1,140 / 780 / 1,424 octets less text on thumbv7m / thumbv6m / riscv32imc
# / thumbv7em than it measured before.
#
# The node and bbmd rows were measured again on 2026-10-18, same
# toolchain, when both images moved onto bacnet-bip-core's port driver
# (#1766), as text / rodata / data / bss, then flash / ram:
#
#   thumbv7m node      13472 /  304 / 0 /  240   14800 /  240
#   thumbv6m node      14708 /  320 / 0 /  240   15220 /  240
#   riscv32imc node    15256 /  760 / 0 /  240   16038 /  240
#   thumbv7em node     13404 /  304 / 0 /  240   14732 /  240
#   thumbv7m bbmd      10036 /  388 / 0 /  240   11448 /  240
#   thumbv6m bbmd      11796 /  388 / 0 /  240   12376 /  240
#   riscv32imc bbmd    12672 /  756 / 0 /  240   13450 /  240
#   thumbv7em bbmd      9968 /  388 / 0 /  240   11380 /  240
#
# The node image now runs a NodePort, which holds the two broadcasts the
# node holds for its first registration in HeldBroadcast slots; before,
# the scenario kept only a count and sent a constant it knew, so its RAM
# never showed what holding costs. A slot is as long as the link's
# broadcasts may be, so the image sizes its link to what it sends: a
# 64-octet budget, the least a link takes, for 54-octet broadcasts and
# slots of 56 octets with their length, where the hosted transport's
# budget of 1,507 octets would need slots of 1,500. The port also sends
# while the received datagram is still borrowed, so the image has a second
# 64-octet datagram buffer: .bss is 240 octets, from 64. .text grew by
# 0.9-1.4 KB, the port's drain, hold and release code. The bbmd image now runs a BbmdPort
# over its Link, which answers the management requests from the tables
# (Tables::serve), Delete-Foreign-Device-Table-Entry among them, where the
# scenario answered three of them by hand and refused the fourth; it also
# checks the link and each requester's address. .text grew by 1.6-2.2 KB,
# with two more steps in the scenario, and .rodata by 64 octets; .bss is
# unchanged.
#
# The router rows were measured again the same day, same toolchain, after
# its BBMD port moved onto bacnet-bip-core's port driver (#1766) and the
# router's counters became drained u32s (#1767), as text / rodata / data
# / bss, then flash / ram:
#
#   thumbv7m router     39652 / 1300 / 0 / 15536   41976 / 15536
#   thumbv6m router     42288 / 1308 / 0 / 15536   43788 / 15536
#   riscv32imc router   45436 / 1828 / 0 / 15536   47286 / 15536
#   thumbv7em router    39500 / 1300 / 0 / 15536   41824 / 15536
#
# Against dev before them (a7145abc), built the same way, .text is 4,340
# / 4,624 / 5,132 / 4,300 octets smaller on thumbv7m / thumbv6m /
# riscv32imc / thumbv7em: the BBMD port runs on its Link and no longer
# links the node engine's exchanges, registration and event queue, though
# it now answers the BBMD's management requests itself (3.9-4.7 KB); and
# the counters' copy no longer needs the out-of-line helper that kept it
# from linking memmove (0.4-0.6 KB). .bss is 40 octets smaller: the
# counters halve (64 less), and the port borrows 20 octets of rows for a
# Read-FDT-Ack (24 more, aligned). The .bss and ram budgets stay at
# 17,376 octets, as they were: these sizes plus 12% round up to 17,408,
# and a budget doesn't rise for an image whose RAM shrank.
#
# The router rows were measured again on 2026-10-18, same toolchain, after
# the router's own Router-Busy (#1697), its next-hop and duplicate
# options (#1698) and its application's requests (#1699), as text /
# rodata / data / bss, then flash / ram:
#
#   thumbv7m router     40028 / 1348 / 0 / 15616   42400 / 15616
#   thumbv6m router     43148 / 1356 / 0 / 15616   44696 / 15616
#   riscv32imc router   45888 / 1876 / 0 / 15616   47786 / 15616
#   thumbv7em router    39832 / 1348 / 0 / 15616   42204 / 15616
#
# Against dev before them (ab81fafb), .text is 1,156 / 1,328 / 1,132 /
# 1,152 octets larger on thumbv7m / thumbv6m / riscv32imc / thumbv7em:
# the congestion state machine and its announcements, linked although the
# image leaves the policy off, and the duplicate check; origination isn't
# called, so it isn't linked. .bss is 80 octets larger, 15,616 in all: the
# router's Storage<2, 8, 8, 4, 1497, Groups, 0> is now 3,336 octets (from
# 3,216: each port's congestion state, the sweep deadline and the latest
# time, moved there from the Router to keep the on-stack Router under 128
# octets). The image names a duplicate record of 0 entries, since it
# leaves duplicate suppression off; Router::new refuses the option over
# such storage. The budgets are unchanged.
#
# The device rows are from when that image joined, on 2026-10-18, same
# toolchain (#1771), as text / rodata / data / bss, then flash / ram:
#
#   thumbv7m device     24420 / 3492 / 0 / 3496   28936 / 3496
#   thumbv6m device     26192 / 3492 / 0 / 3496   29876 / 3496
#   riscv32imc device   28456 / 3976 / 0 / 3496   32454 / 3496
#   thumbv7em device    24264 / 3488 / 0 / 3496   28776 / 3496
#
# These are after the review round that has it leave confirmed requests
# by broadcast unanswered, and its scenario send two: 0.2-0.6 KB more
# .text than first measured.
#
# It is a whole MS/TP device with no allocator: the MS/TP codec and master
# core, bacnet-npdu's view, and the allocation-free profile of
# bacnet-types, bacnet-encoding and bacnet-services, answering Who-Is and
# ReadProperty for a Device object and an Analog Input. Its .bss is one
# static of 3,496 octets: the core's StandardStorage<1, 2, 1> (about 3.3 KB: 501
# octets of receive storage, the queues' three standard slots and the
# action buffers), the application's scratch (88: 64 for an answer's APDU
