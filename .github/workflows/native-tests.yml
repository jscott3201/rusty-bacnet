name: Native tests

# Runs the tests, clippy and rustdoc natively on macOS (Apple Silicon) and
# Windows (x86_64 MSVC), on GitHub-hosted runners (#950). The Linux jobs are in
# ci.yml. See docs/ci.md.
#
# Each platform runs two jobs in parallel: Tests (the workspace test build,
# the stack guard and the doctests) and Lint and Python (clippy, rustdoc, the
# CLI's default-feature tests, and the Python bindings with their tests).
# Native OK waits for all four and passes only when every one succeeded: with
# ci.yml's CI OK, it is one of the two checks a PR needs to merge.
#
# It runs on every PR to dev or main, on pushes to them (merges), whose runs
# save the caches PRs restore, and by hand. Tag pushes don't run it. On a
# push to dev, Plan skips both jobs when the merge could have been a
# fast-forward to its PR head, whose own run of this workflow (testing that
# same tree) passed Native OK, and no cache-key input changed; Native OK
# still passes then (#1466; scripts/ci/plan-skip.sh).

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a PR (or to main) cancels its superseded run. On dev each
  # commit gets a group of its own, so no run is cancelled or replaced while
  # pending, and every merge gets its own native result. (A shared group without
  # cancel-in-progress would still let a newer pending run replace an older one.)
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/dev' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

env:
  CARGO_TERM_COLOR: always
  # Same build settings as ci.yml: no incremental state, and test binaries
  # without native debug info (less codegen, linking and cache).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The tests the stack guard step reruns with smaller stacks (#953): every
  # server, client, endpoint, integration and CLI test, the benchmark SC mTLS
  # tests, and bacnet-transport's BACnet/SC tests (node, TLS dial, direct
  # connection and hub, unit and integration).
  STACK_GUARD_TESTS: >-
    package(bacnet-server) | package(bacnet-client) | package(bacnet-endpoint)
    | package(bacnet-integration-tests) | package(bacnet-cli)
    | binary_id(bacnet-benchmarks::sc_mtls)
    | (package(bacnet-transport) & (test(/^(sc_hub|sc_tls|sc)::/) | binary_id(/^bacnet-transport::sc_hub/)))

jobs:
  # Whether this push to dev can skip the native jobs (#1466): see
  # scripts/ci/plan-skip.sh for the conditions. Any other event skips this
  # job, so its output is empty and everything runs; so does any error.
  plan:
    name: Plan
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Workflow runs, check runs and the compare API, read only.
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      # Depth 2 fetches both parents of the merge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Skip if the PR's run already tested this tree
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/plan-skip.sh "Native OK" .github/workflows/native-tests.yml

  tests:
    name: Tests (${{ matrix.name }})
    # Both native jobs run unless plan skips them; !cancelled() runs them
    # when plan itself was skipped (every other event) or failed.
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Report both platforms even when one fails.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS arm64
          - os: windows-latest
            name: Windows x86_64
    defaults:
      run:
        shell: bash
    steps:
      # CompatTelRunner.exe, the Microsoft Compatibility Appraiser's runner, can
      # take all four of the Windows runner's CPUs for seconds at a time, long
      # enough to blow a test's timing budget (#1003). The runner image already
      # disables the scheduled tasks that run it; during a job it's the
      # Inventory and Compatibility Appraisal service (InventorySvc) that starts
      # it, several times, for a software inventory. So this disables and stops
      # that service, disables any task that runs CompatTelRunner.exe in case a
      # newer image re-enables one, and stops any running copy. It logs what it
      # found, takes about two seconds and never fails the job. Every Windows
      # job runs it first.
      - &stop-appraiser
        name: Stop the Compatibility Appraiser
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $service = Get-Service -Name InventorySvc -ErrorAction SilentlyContinue
          if (-not $service) {
            Write-Host 'no InventorySvc service'
          } else {
            $was = "$($service.Status), $($service.StartType)"
            try {
              Set-Service -Name InventorySvc -StartupType Disabled -ErrorAction Stop
              Stop-Service -Name InventorySvc -Force -ErrorAction Stop
              Write-Host "disabled and stopped InventorySvc (was $was)"
            } catch {
              Write-Host "could not disable or stop InventorySvc ($was): $($_.Exception.Message)"
            }
          }
          $tasks = @(Get-ScheduledTask | Where-Object { $_.Actions.Execute -match 'compattelrunner' })
          if (-not $tasks) { Write-Host 'no scheduled task runs CompatTelRunner.exe' }
          foreach ($task in $tasks) {
            $name = $task.TaskPath + $task.TaskName
            if ($task.State -eq 'Disabled') { Write-Host "task $name is disabled"; continue }
            try {
              if ($task.State -eq 'Running') { $task | Stop-ScheduledTask -ErrorAction Stop }
              $task | Disable-ScheduledTask -ErrorAction Stop | Out-Null
              Write-Host "disabled task $name (was $($task.State))"
            } catch {
              Write-Host "could not disable task $name ($($task.State)): $($_.Exception.Message)"
            }
          }
          $running = @(Get-CimInstance Win32_Process -Filter "Name = 'CompatTelRunner.exe'")
          if (-not $running) { Write-Host 'CompatTelRunner.exe is not running' }
          foreach ($process in $running) {
            Write-Host "stopping CompatTelRunner.exe $($process.ProcessId): $($process.CommandLine)"
            Stop-Process -Id $process.ProcessId -Force -ErrorAction SilentlyContinue
          }
          exit 0
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The macOS feature list from scripts/ci/local-macos.sh: every optional
      # feature except the Linux-only serial-gpio and ethernet. Windows also leaves
      # out bacnet-cli/pcap, which needs the Npcap SDK.
      - &feature-set
        name: Feature set
        run: |
          features=$(sed -n 's/^features=//p' scripts/ci/local-macos.sh)
          [ -n "$features" ] || { echo "::error::no features= line in scripts/ci/local-macos.sh"; exit 1; }
          if [ "$RUNNER_OS" = Windows ]; then
            features=$(tr , '\n' <<<"$features" | grep -vx bacnet-cli/pcap | paste -sd , -)
          fi
          # Only feature names reach GITHUB_ENV.
          [[ $features =~ ^[A-Za-z0-9_/,-]+$ ]] || { echo "::error::unexpected characters in the feature list"; exit 1; }
          echo "NATIVE_FEATURES=$features" | tee -a "$GITHUB_ENV"
      # The cargo-nextest and maturin versions that ci.yml installs too, and
      # the Python version, from .github/ci-pins.env. rust-cache hashes none of
      # these names into its key.
      - &pins
        name: Tool pins
        run: |
          for name in NEXTEST_VERSION MATURIN_VERSION PYTHON_VERSION; do
            value=$(sed -n "s/^$name=//p" .github/ci-pins.env)
            [[ $value =~ ^[0-9][0-9A-Za-z.]*$ ]] || { echo "::error::no single $name in .github/ci-pins.env"; exit 1; }
            echo "$name=$value" | tee -a "$GITHUB_ENV"
          done
      # The runner images ship rustup. This installs the channel that
      # rust-toolchain.toml pins, so there is no version to keep in sync here,
      # with the minimal profile plus the components that file lists. The
      # file's default profile adds rust-docs, thousands of small files: with
      # it the step took about a minute on Windows (median; up to three),
      # without it 10 to 20 seconds. Once every listed component is there,
      # rustup's proxies leave the install alone. aws-lc-sys (sc-tls) builds
      # with the images' own C tools: on Windows, MSVC plus the NASM and CMake
      # already on PATH.
      - &toolchain
        name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]$/\1/p' rust-toolchain.toml | tr -d '" ')
          [[ $channel =~ ^[0-9A-Za-z.-]+$ && $components =~ ^[a-z,-]+$ ]] \
            || { echo "::error::no channel or components line in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$channel" --profile minimal --component "$components"
          rustc -vV
      # Only dev saves the cache, and only from a successful job, so a failed or
      # cancelled first run can't leave a partial cache that later runs restore
      # by exact key. PR runs restore dev's. The key includes the job id, so
      # each job keeps its own.
      - &rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          env-vars: NATIVE_FEATURES
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - &nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      # nextest runs each test in its own process (.config/nextest.toml); it
      # does not run doctests, so cargo test --doc covers those. Every later
      # step runs even when an earlier one failed, to report each failure.
      - name: Tests
        run: cargo nextest run --workspace --exclude rusty-bacnet --locked --features "$NATIVE_FEATURES" --profile ci
      # Stack guard (#953). Debug-build futures and test fixtures can grow
      # toward a thread's stack limit, and only Windows, whose main thread gets
      # 1 MiB, used to show it. This reruns STACK_GUARD_TESTS with 1 MiB thread
      # stacks rather than 2 MiB (RUST_MIN_STACK sizes the test threads and
      # tokio's workers), and on macOS gives the `bacnet` processes the CLI
      # tests start a 1 MiB main thread too, as Windows does (ulimit -s). rustc
      # also reads RUST_MIN_STACK, so the --no-run first makes sure the guarded
      # run has nothing left to build.
      - name: Tests with 1 MiB stacks
        if: ${{ !cancelled() }}
        run: |
          args=(--workspace --exclude rusty-bacnet --locked --features "$NATIVE_FEATURES" --profile ci)
          cargo nextest run "${args[@]}" --no-run
          if [ "$RUNNER_OS" != Windows ]; then ulimit -s 1024; fi
          RUST_MIN_STACK=1048576 cargo nextest run "${args[@]}" -E "$STACK_GUARD_TESTS"
      - name: Doctests
        if: ${{ !cancelled() }}
        run: cargo test --doc --workspace --exclude rusty-bacnet --locked --features "$NATIVE_FEATURES"

  lint:
    name: Lint and Python (${{ matrix.name }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS arm64
          - os: windows-latest
            name: Windows x86_64
    defaults:
      run:
        shell: bash
    steps:
      - *stop-appraiser
      - *checkout
      - *feature-set
      - *pins
      - *toolchain
      - *rust-cache
      - *nextest
      # Every PyO3 build below links this interpreter (#919): PYO3_PYTHON is
      # set to it, not to the venv that the maturin step makes.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Point PyO3 at that interpreter
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: echo "PYO3_PYTHON=$PYTHON_PATH" >> "$GITHUB_ENV"

      # Warnings are errors for workspace code only, as in ci.yml. Every later
      # step runs even when an earlier one failed, to report each failure.
      - name: Clippy (every native feature)
        run: cargo clippy --workspace --exclude rusty-bacnet --all-targets --locked --features "$NATIVE_FEATURES" -- -D warnings
      - name: Clippy (PyO3 bindings)
        if: ${{ !cancelled() }}
        run: cargo clippy -p rusty-bacnet --all-targets --locked -- -D warnings
      # The lean bacnet-cli without its default `tui` (#974), whose platform
      # code differs here; ci.yml also runs its tests on Linux.
      - name: Clippy (bacnet-cli, no default features)
        if: ${{ !cancelled() }}
        run: cargo clippy -p bacnet-cli --no-default-features --all-targets --locked -- -D warnings
      # Private items too, as in ci.yml (#1164).
      - name: Rustdoc (every native feature, private items)
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --exclude rusty-bacnet --no-deps --locked --document-private-items --features "$NATIVE_FEATURES"
      - name: Rustdoc (PyO3 bindings, private items)
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p rusty-bacnet --no-deps --locked --document-private-items
      # Tests that exist only with a feature off (the CLI's rebuild advice for
      # sc-tls and pcap), which the feature set compiles out. They build
      # bacnet-cli with its default features, which the Tests job's build
      # can't reuse, so they run here, off that job's longer path.
      - name: bacnet-cli tests (default features)
        if: ${{ !cancelled() }}
        run: cargo nextest run -p bacnet-cli --locked --profile ci

      # A debug extension builds faster, and the suite doesn't need release speed.
      - name: Build the extension (maturin develop)
        if: ${{ !cancelled() }}
        # Later steps get the venv through GITHUB_ENV and GITHUB_PATH. On
        # Windows the paths use the D:/a/... form, which both bash and native
        # programs accept.
        run: |
          venv=$RUNNER_TEMP/venv
          bin=$venv/bin
          if [ "$RUNNER_OS" = Windows ]; then venv=$(cygpath -m "$venv"); bin=$venv/Scripts; fi
          python -m venv "$venv"
          echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"
          export VIRTUAL_ENV=$venv
          "$bin/python" --version
          "$bin/python" -m pip install --disable-pip-version-check "maturin==$MATURIN_VERSION"
          "$bin/maturin" develop -m crates/rusty-bacnet/Cargo.toml --locked
      # The SC tests make certificates with the openssl CLI.
      - name: Python tests
        if: ${{ !cancelled() }}
        run: |
          openssl version
          python -m unittest discover -s crates/rusty-bacnet/tests
      # The crate's lib unit tests and integration tests, linked against the
      # setup-python interpreter's libpython (#919), not the venv's.
      - name: PyO3 crate Rust tests
        if: ${{ !cancelled() }}
        run: cargo nextest run -p rusty-bacnet --locked --profile ci

  # The merge gate's native check: green only when every job above succeeded on
  # every platform. It runs even when one failed or was cancelled, so it always
  # reports, the same pattern as ci.yml's CI OK. A skipped job fails it, unless
  # plan succeeded and said skip (#1466): then it still runs and passes, so a
  # skipped merge's commit shows Native OK green like any other, as its tree
  # is the one the PR's run tested. Plan's own result counts for
  # nothing else: if it failed, the native jobs ran.
  native-ok:
    name: Native OK
    if: ${{ always() }}
    needs: [plan, tests, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every native job succeeded or was skipped by plan
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -r 'if .plan.result == "success" and .plan.outputs.skip == "true"
            then "plan: skipped the native jobs; the PR run tested this tree" else empty end'
          echo "$NEEDS" | jq -e '(.plan.result == "success" and .plan.outputs.skip == "true") as $planned
            | all(to_entries[] | select(.key != "plan");
              .value.result == "success" or (.value.result == "skipped" and $planned))' >/dev/null

  # After a green run on dev, delete the cache entries no run will restore
  # again (#1471), as ci.yml does after its own; see the script. The status
  # check names Native OK's result alone, as ci.yml's does.
  prune-caches:
    name: Prune caches
    needs: native-ok
    if: ${{ !cancelled() && needs.native-ok.result == 'success' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Delete superseded cache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/prune-caches.sh
