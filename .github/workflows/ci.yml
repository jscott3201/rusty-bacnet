name: CI

# Linux CI on GitHub-hosted Ubuntu 24.04 runners (x86_64, 4 vCPU). The jobs run
# on the runner itself, with no job container: each installs the toolchain that
# rust-toolchain.toml pins, the tools pinned in .github/ci-pins.env (checked
# against their SHA-256) and the apt packages it needs. The tests, clippy and
# rustdoc also run natively on macOS and Windows, in native-tests.yml (#950).
# See docs/ci.md.
#
#   Lean  — every PR to dev/main, push to dev/main, v* tags, weekly, manual:
#           lint (fmt, file-size cap, no-secret scan, script regressions,
#           changelog fragments, the pins, the fuzz crates' lockfiles),
#           clippy and rustdoc with warnings denied (every feature, the PyO3
#           crate, and each published crate alone with default features, for
#           Linux, Windows and macOS; the every-feature and PyO3 rustdoc runs
#           include private items), the no_std crates on bare-metal targets
#           and their alloc tests on the host, and the firmware images
#           (MS/TP and B/IP without an allocator, the APDU stack with one)
#           linked and checked against their size budgets,
#           every-feature Linux tests plus bacnet-cli's feature-off tests
#           and the no_std crates' tests and doctests without std,
#           and the Python bindings built with maturin, their unittest suite,
#           the website's sample tests (the loopback lab and the CLI samples)
#           and the PyO3 crate's own Rust tests.
#   Heavy — PRs to main, push to main, v* tags, weekly schedule, manual:
#           MSRV (Linux native, incl. optional features, the no_std builds
#           and pcap link), audit, deny.
#   CI OK — the required status; fails if any job above failed.
#
# Pushes to dev (PR merges) run the Lean jobs. Only runs on dev save the Rust
# caches, which every PR restores (a PR run's own saves would be scoped to that
# PR), and the merge result itself is tested (#904). After a green run on dev,
# Prune caches deletes the entries no run will restore again, so the Linux and
# native caches stay under the repository's 10 GB (#1471).
#
# Plan — pushes to dev only: when the merge could have been a fast-forward
#        to its PR head, the PR's own ci.yml run tested that same tree, so
#        if its CI OK passed and no cache-key input changed, the Lean jobs
#        skip and CI OK still passes (#1466; scripts/ci/plan-skip.sh).

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]
    tags: ["v*"]
  schedule:
    # Advisory databases change without code changes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event, so a scheduled or manual run never cancels a push's run, nor a
  # PR's run a merge's. Within an event, per ref: a newer push to a PR, to
  # main or to a tag cancels the superseded run, and a newer scheduled or
  # manual run on a branch cancels the older one. Pushes to dev are the
  # exception, as in native-tests.yml: each commit gets a group of its own,
  # keyed by its SHA, and nothing cancels it, so two merges minutes apart each
  # get a CI result, and a late duplicate push event for an older commit can't
  # cancel the run for dev's head. (A shared group without cancel-in-progress
  # would still let a newer pending run replace an older one.)
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/dev' }}

env:
  CARGO_TERM_COLOR: always
  # CI builds are from scratch or a restored cache; incremental state is dead weight.
  CARGO_INCREMENTAL: "0"
  # Test binaries without native debug info: less codegen, linking and cache.
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Every PyO3 build (clippy, rustdoc, maturin, the crate's Rust tests) uses
  # Ubuntu's own Python 3.12, which libpython3-dev matches, whatever else is
  # on PATH.
  PYO3_PYTHON: /usr/bin/python3
  # Every optional feature that builds on Linux, including per-crate features
  # such as bacnet-endpoint/sc-tls and bacnet-cli/{sc-tls,pcap,serial} that nothing
  # else in the workspace turns on (#906). bacnet-cli's `tui` is a default
  # feature (#974), so every workspace run has it. bacnet-benchmarks/console
  # is left out: it needs tokio_unstable.
  LINUX_FEATURES: bacnet-types/serde,bacnet-encoding/heapless,bacnet-mstp-codec/bytes,bacnet-mstp-codec/heapless,bacnet-mstp-core/alloc,bacnet-bip-codec/bytes,bacnet-bip-codec/heapless,bacnet-router-core/bip,bacnet-router-core/mstp,bacnet-transport/ipv6,bacnet-transport/sc-tls,bacnet-transport/serial,bacnet-transport/serial-gpio,bacnet-transport/ethernet,bacnet-client/ipv6,bacnet-client/sc-tls,bacnet-server/sc-tls,bacnet-endpoint/sc-tls,bacnet-integration-tests/ipv6,bacnet-integration-tests/ethernet,bacnet-integration-tests/sc-tls,bacnet-cli/sc-tls,bacnet-cli/pcap,bacnet-cli/serial,bacnet-cli/mcp

jobs:
  # Whether this push to dev can skip the Lean jobs (#1466): see
  # scripts/ci/plan-skip.sh for the conditions. Any other event skips this
  # job, so its output is empty and everything runs; so does any error.
  plan:
    name: Plan
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Workflow runs, check runs and the compare API, read only.
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      # Depth 2 fetches both parents of the merge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Skip if the PR's run already tested this tree
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/plan-skip.sh "CI OK" .github/workflows/ci.yml

  lint:
    name: Lint
    # The Lean jobs run unless plan skips them; !cancelled() runs them when
    # plan itself was skipped (every other event) or failed.
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image ships rustup. This installs the channel that
      # rust-toolchain.toml pins, with the minimal profile plus the components
      # that file lists (its default profile adds rust-docs, which no job
      # reads), and makes it the default. Then it removes the image's own
      # toolchains: rust-cache hashes every installed toolchain into its key,
      # and the image's stable moves with image updates, which would start the
      # jobs cold each time.
      - &toolchain
        name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]$/\1/p' rust-toolchain.toml | tr -d '" ')
          [[ $channel =~ ^[0-9A-Za-z.-]+$ && $components =~ ^[a-z,-]+$ ]] \
            || { echo "::error::no channel or components line in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$channel" --profile minimal --component "$components"
          rustup default "$channel"
          rustup toolchain list | awk -v ours="$channel-" 'index($1, ours) != 1 { print $1 }' \
            | xargs -r -n1 rustup toolchain uninstall
          rustup toolchain list
          rustc -vV
      # Every line of the pins file is a comment, blank or NAME=value with a
      # plain value that starts with a letter or digit, once per name, and
      # every *_SHA256 is a SHA-256 in hex; the toolchain pin is an exact
      # release, and the fuzz nightly a dated one; and the MSRV is the same in
      # the pins, Cargo.toml and check-msrv.sh.
      - name: Check the pins
        run: |
          pins=.github/ci-pins.env
          fail=0
          if bad=$(grep -nvE '^(#.*|[A-Z0-9_]+=[0-9A-Za-z][0-9A-Za-z.-]*)?$' "$pins"); then
            echo "::error::malformed lines in $pins:"; echo "$bad"; fail=1
          fi
          if bad=$(grep -nE '^[A-Z0-9_]+_SHA256=' "$pins" | grep -vE '^[0-9]+:[A-Z0-9_]+_SHA256=[0-9a-f]{64}$'); then
            echo "::error::digests in $pins that aren't 64 lowercase hex digits:"; echo "$bad"; fail=1
          fi
          if ! grep -qE '^RUST_FUZZ_NIGHTLY=nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$' "$pins"; then
            echo "::error::$pins has no RUST_FUZZ_NIGHTLY=nightly-YYYY-MM-DD"; fail=1
          fi
          if dup=$(grep -oE '^[A-Z0-9_]+=' "$pins" | sort | uniq -d | grep .); then
            echo "::error::names set twice in $pins:"; echo "$dup"; fail=1
          fi
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          msrv=$(sed -n 's/^RUST_MSRV=//p' "$pins")
          rust_version=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          if ! [[ $channel =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::rust-toolchain.toml's channel is \"$channel\", not an exact release"; fail=1
          fi
          if [ -z "$msrv" ] || [ "$rust_version" != "$msrv" ]; then
            echo "::error::Cargo.toml's rust-version is $rust_version, $pins's RUST_MSRV \"$msrv\""; fail=1
          fi
          if ! grep -qF "RUSTUP_TOOLCHAIN:-$msrv}" scripts/ci/check-msrv.sh; then
            echo "::error::scripts/ci/check-msrv.sh's default toolchain is not $msrv"; fail=1
          fi
          exit $fail
      # Each fuzz crate's own Cargo.lock still matches its manifests. It
      # records the fuzzed crate's workspace version and the workspace's
      # dependency requirements, so a change to either that skipped `fuzz.sh
      # lock` fails here, not in a scheduled fuzz run (docs/ci.md, "Fuzzing").
      - name: Fuzz crate lockfiles
        run: bash scripts/ci/fuzz.sh lock --check
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: File-size cap (700 LOC)
        run: bash scripts/ci/check-file-size.sh
      - name: No-secret scan
        run: |
          bash scripts/ci/test-check-no-secrets.sh
          bash scripts/ci/check-no-secrets.sh
      - name: Plan script regressions
        run: bash scripts/ci/test-plan-skip.sh
      - name: MSRV script regressions
        run: python3 scripts/ci/test-check-msrv.py
      - name: Firmware size script regressions
        run: python3 scripts/ci/test-firmware-size.py
      # The three private copies of named_codes! (docs/ci.md, "Local checks").
      - name: named_codes! copies match
        run: python3 scripts/ci/check-named-codes.py
      - name: Release script tests
        run: python3 -m unittest discover -s scripts/release
      # Entries are changelog.d/ fragments; [Unreleased] in CHANGELOG.md holds none.
      - name: Changelog fragments
        run: |
          python3 -m unittest discover -s scripts -p 'test_changelog.py'
          python3 scripts/changelog.py check

  clippy:
    name: Clippy
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The per-crate default-features check runs for these targets (#981):
      # Windows and macOS compile different code behind their platform cfgs.
      # In the cache key, so a change restarts the cache with their dependencies.
      DEFAULT_FEATURES_TARGETS: x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin
      # Bare-metal targets for the no_std check (#1604), in the cache key too.
      NO_STD_TARGETS: thumbv6m-none-eabi thumbv7em-none-eabihf riscv32imac-unknown-none-elf
      # Targets the firmware link test builds its images for (#1626), each with
      # budgets in firmware/link/size-budget.toml; in the cache key too.
      FIRMWARE_TARGETS: thumbv7m-none-eabi thumbv6m-none-eabi riscv32imc-unknown-none-elf thumbv7em-none-eabihf
      # pcap for bacnet-cli, whose build script loads libpcap.
      APT_PACKAGES: libpcap-dev
    steps:
      - *checkout
      # The packages in APT_PACKAGES that the runner image lacks, so a job
      # whose packages are all there skips apt-get update.
      - &apt
        name: Install apt packages
        run: |
          missing=()
          for package in $APT_PACKAGES; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            [ "$status" = "install ok installed" ] || missing+=("$package")
          done
          echo "missing: ${missing[*]:-none}"
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update -qq
            # wireshark-common (tshark, #971) asks a debconf question; sudo
            # drops the environment, so the front end goes on its line.
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends "${missing[@]}"
          fi
      - *toolchain
      # Only their standard libraries: neither clippy nor rustdoc links.
      - name: Add the default-features check's targets
        run: |
          # shellcheck disable=SC2086 # one argument per target
          rustup target add $DEFAULT_FEATURES_TARGETS
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          env-vars: LINUX_FEATURES DEFAULT_FEATURES_TARGETS NO_STD_TARGETS FIRMWARE_TARGETS
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # Warnings are errors for workspace code only; dependencies are unaffected.
      # The workspace includes the samples in examples/rust/samples (#1450).
      - name: Clippy (every feature)
        run: cargo clippy --workspace --exclude rusty-bacnet --all-targets --locked --features "$LINUX_FEATURES" -- -D warnings
      # !cancelled(): report every configuration, not just the first failure.
      - name: Clippy (PyO3 bindings)
        if: ${{ !cancelled() }}
        run: cargo clippy -p rusty-bacnet --all-targets --locked -- -D warnings
      # The lean bacnet-cli: one-shot commands only, without the default `tui`.
      - name: Clippy (bacnet-cli, no default features)
        if: ${{ !cancelled() }}
        run: cargo clippy -p bacnet-cli --no-default-features --all-targets --locked -- -D warnings
      # One cargo run per crate checks the targets side by side, which costs a
      # few seconds more than Linux alone did.
      - name: Clippy and rustdoc (each published crate, default features; no_std types, encoding and services; Linux, Windows, macOS)
        if: ${{ !cancelled() }}
        run: |
          # shellcheck disable=SC2086 # one argument per target
          bash scripts/ci/check-default-features.sh $DEFAULT_FEATURES_TARGETS
      # The no_std crates with each feature set, on targets with no std and no
      # allocator unless a crate asks for alloc. Only their core and alloc
      # libraries are needed: clippy doesn't link. On thumbv6m, the builds
      # with bytes bring in firmware/nostd-harness for portable-atomic's
      # backend (#1613).
      - name: Clippy (no_std crates, bare-metal targets)
        if: ${{ !cancelled() }}
        run: |
          # shellcheck disable=SC2086 # one argument per target
          rustup target add $NO_STD_TARGETS
          # shellcheck disable=SC2086
          bash scripts/ci/check-no-std.sh $NO_STD_TARGETS
      # bacnet-types, bacnet-encoding, bacnet-services and bacnet-objects
      # with alloc and without std, tests included: Test runs those tests,
      # and no run above lints them (#1613, #1615).
      - name: Clippy (no_std crates with alloc, all targets)
        if: ${{ !cancelled() }}
        run: cargo clippy -p bacnet-types -p bacnet-encoding -p bacnet-services -p bacnet-objects --no-default-features --features alloc --all-targets --locked -- -D warnings
      # And without alloc either, the allocation-free profile (#1614).
      - name: Clippy (no_std crates without alloc, all targets)
        if: ${{ !cancelled() }}
        run: cargo clippy -p bacnet-types -p bacnet-encoding -p bacnet-services --no-default-features --all-targets --locked -- -D warnings
      # Clippy doesn't link, so this builds the stacks into bare-metal images
      # (firmware/link), one per stack, for each target, and checks their
      # sizes against the budget: MS/TP (extended frames off and on), the
      # B/IP codec, node and BBMD, and a router between B/IP and MS/TP with
      # no allocator (#1664, #1667, #1679), and
      # bacnet-encoding and bacnet-services with one, its critical section
      # and, without compare-and-swap, portable-atomic (#1635). It links with
      # the rust-lld that rustc ships, so the targets' core libraries are all
      # it needs. Nothing runs the images; the scenarios they link run in Test.
      - name: Firmware link test (bare-metal images, size budgets)
        if: ${{ !cancelled() }}
        run: |
          # shellcheck disable=SC2086 # one argument per target
          rustup target add $FIRMWARE_TARGETS
          # shellcheck disable=SC2086
          bash scripts/ci/check-firmware-link.sh $FIRMWARE_TARGETS
      # Private and pub(crate) items too, so their intra-doc links can't rot
      # (#1164). This run still flags public docs that link to private items
      # (rustdoc::private_intra_doc_links), so it replaces the public-only run.
      - name: Rustdoc (every feature, private items)
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --exclude rusty-bacnet --no-deps --locked --document-private-items --features "$LINUX_FEATURES"
      # Every module of the PyO3 crate is private, so only this run checks its docs.
      - name: Rustdoc (PyO3 bindings, private items)
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p rusty-bacnet --no-deps --locked --document-private-items
      # The runner has about 14 GB free on /, and the largest job needs about
      # 6 GB (docs/ci.md, "Runner"). This logs the margin, and the limits the
      # tests ran under.
      - &disk
        name: Disk use and limits
        if: ${{ !cancelled() }}
        run: |
          df -h /
          du -sh target "${CARGO_HOME:-$HOME/.cargo}" "${RUSTUP_HOME:-$HOME/.rustup}" 2>/dev/null || true
          echo "user $(id -un), $(nproc) CPUs, open files: soft $(ulimit -Sn), hard $(ulimit -Hn)"

  test:
    name: Test (Linux, full features)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # tshark reads the Capture screen's pcap exports (#971); with
      # REQUIRE_TSHARK its test fails rather than skips without it.
      APT_PACKAGES: libpcap-dev tshark
      REQUIRE_TSHARK: "1"
    steps:
      - *checkout
      - *apt
      - *toolchain
      # Only runs on dev save, and only from a successful job, so a failed or
      # cancelled run can't leave a partial cache that later runs restore by
      # exact key. PR runs restore dev's.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          env-vars: LINUX_FEATURES
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Install cargo-nextest
        run: bash scripts/ci/install-tools.sh cargo-nextest
      # nextest runs each test in its own process (.config/nextest.toml);
      # it does not run doctests, so cargo test --doc covers those.
      - run: cargo nextest run --workspace --exclude rusty-bacnet --locked --features "$LINUX_FEATURES" --profile ci
      - run: cargo test --doc --workspace --exclude rusty-bacnet --locked --features "$LINUX_FEATURES"
      # Tests that exist only with a feature off (the CLI's rebuild advice for
      # sc-tls and pcap); LINUX_FEATURES compiles them out.
      - name: bacnet-cli tests (default features)
        run: cargo nextest run -p bacnet-cli --locked --profile ci
      # And with no default features at all: the lean CLI without the TUI,
      # whose plain `bacnet` prints the usage and `bacnet tui` the rebuild
      # advice (#974).
      - name: bacnet-cli tests (no default features)
        if: ${{ !cancelled() }}
        run: cargo nextest run -p bacnet-cli --no-default-features --locked --profile ci
      # The no_std crates with alloc and their std feature off: the code a
      # bare-metal build compiles, which every run above leaves out (#1613).
      # For bacnet-objects that is the inline save writer, the spin lock and
      # hashbrown's maps (#1615).
      # The tests themselves still link std; check-no-std.sh shows the code
      # needs none.
      - name: no_std crates' tests (alloc, without std)
        if: ${{ !cancelled() }}
        run: cargo nextest run -p bacnet-types -p bacnet-encoding -p bacnet-services -p bacnet-objects --no-default-features --features alloc --locked --profile ci
      - name: no_std crates' doctests (alloc, without std)
        if: ${{ !cancelled() }}
        run: cargo test --doc -p bacnet-types -p bacnet-encoding -p bacnet-services -p bacnet-objects --no-default-features --features alloc --locked
      # Without alloc either (#1614): the allocation-free profile's code, and
      # tests/no_alloc_subset.rs, which counts the subset's allocations: none.
      - name: no_std crates' tests (without alloc)
        if: ${{ !cancelled() }}
        run: cargo nextest run -p bacnet-types -p bacnet-encoding -p bacnet-services --no-default-features --locked --profile ci
      # The examples that build values with alloc are gated on it, or write
      # to sinks, so the allocation-free profile's doctests run too (#1779).
      - name: no_std crates' doctests (without alloc)
        if: ${{ !cancelled() }}
        run: cargo test --doc -p bacnet-types -p bacnet-encoding -p bacnet-services --no-default-features --locked
      - *disk

  python:
    name: Python bindings
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # venv for the maturin build; libpython for the PyO3 crate's test binaries.
      APT_PACKAGES: python3-venv libpython3-dev
    steps:
      - *checkout
      - *apt
      - *toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Install cargo-nextest and maturin
        run: bash scripts/ci/install-tools.sh cargo-nextest maturin
      # A debug extension builds faster, and the suite doesn't need release speed.
      - name: Build the extension (maturin develop)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          python --version
          maturin develop -m crates/rusty-bacnet/Cargo.toml --locked
      # The SC tests make certificates with the openssl CLI.
      - name: Python tests
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          openssl version
          python -m unittest discover -s crates/rusty-bacnet/tests
      # The website's samples (#1989): the loopback lab's tests, and the CLI
      # samples its pages show, run against that lab on 127.0.0.1. This is
      # the only job with the extension installed, and its maturin build
      # has already compiled the BACnet crates the CLI shares, in the same
      # target directory and dev profile, so the CLI build adds little; the
      # dev runs cache it with the rest.
      - name: Build the CLI for the website samples
        if: ${{ !cancelled() }}
        run: cargo build -p bacnet-cli --locked
      - name: Website sample tests
        if: ${{ !cancelled() }}
        env:
          BACNET_CLI: ${{ github.workspace }}/target/debug/bacnet
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          # The lab expects the site's release; this wheel has the workspace's version.
          BACNET_LAB_EXPECTED_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          export BACNET_LAB_EXPECTED_VERSION
          python -m unittest discover -s website/tests/python -v
      # The crate's lib unit tests and integration tests, linked against
      # PYO3_PYTHON's libpython (#919), not the venv's, so this step doesn't
      # depend on the maturin build.
      - name: Rust tests
        if: ${{ !cancelled() }}
        run: cargo nextest run -p rusty-bacnet --locked --profile ci
      - *disk

  msrv:
    name: MSRV (Linux native)
    # Skip PRs to dev and dev merges; any other event (main, tags, schedule on
    # dev, manual, or a trigger added later) runs it.
    if: ${{ (github.event_name != 'pull_request' || github.base_ref == 'main') && !(github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # check-msrv.sh needs pkg-config's libpcap for the linked pcap build.
      APT_PACKAGES: libpcap-dev
    steps:
      - *checkout
      - *apt
      - *toolchain
      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml for the rest of the job,
      # so the documented MSRV is what compiles. Lint checks that RUST_MSRV
      # matches Cargo.toml and check-msrv.sh.
      - name: Install the MSRV toolchain
        run: |
          msrv=$(sed -n 's/^RUST_MSRV=//p' .github/ci-pins.env)
          [[ $msrv =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::no RUST_MSRV in .github/ci-pins.env"; exit 1; }
          rustup toolchain install "$msrv" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      # The scheduled run on dev is the one that saves this cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # Publishable crates with consumer-visible features, the no_std builds
      # of bacnet-types, bacnet-encoding, bacnet-services and bacnet-objects (alloc, no std),
      # then the ethernet, serial and serial-gpio transport checks and a
      # linked bacnet-cli pcap build.
      - run: bash scripts/ci/check-msrv.sh --linux-native
      - *disk

  audit-deny:
    name: Cargo Audit + Deny
    # Skip PRs to dev and dev merges; any other event (main, tags, schedule on
    # dev, manual, or a trigger added later) runs it.
    if: ${{ (github.event_name != 'pull_request' || github.base_ref == 'main') && !(github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - *toolchain
      - name: Install cargo-audit and cargo-deny
        run: bash scripts/ci/install-tools.sh cargo-audit cargo-deny
      - name: Cargo Audit
        run: cargo audit --color always
      - name: Cargo Deny
        if: ${{ !cancelled() }}
        run: cargo deny --all-features check

  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs: [plan, lint, clippy, test, python, msrv, audit-deny]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only the Heavy jobs may be skipped, by their tier; a skipped Lean job
      # fails it, unless plan succeeded and said skip (#1466). Then this job
      # still runs and passes, so a skipped merge's commit shows CI OK green
      # like any other: its tree is the one the PR's run tested. Plan's
      # own result counts for nothing else: if it failed, the Lean jobs ran.
      - name: All required jobs succeeded or were skipped by tier or plan
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -r 'if .plan.result == "success" and .plan.outputs.skip == "true"
            then "plan: skipped the Lean jobs; the PR run tested this tree" else empty end'
          echo "$NEEDS" | jq -e '(.plan.result == "success" and .plan.outputs.skip == "true") as $planned
            | all(to_entries[] | select(.key != "plan");
              .value.result == "success"
              or (.value.result == "skipped" and (.key == "msrv" or .key == "audit-deny" or $planned)))' >/dev/null

  # After a green run on dev (a merge, the schedule or a manual run), delete
  # the cache entries no run will restore again (#1471). native-tests.yml runs
  # the same script after its own dev runs; see the script for what it keeps.
  # The status check names CI OK alone: the implicit success() would also
  # need msrv and audit-deny, which a dev merge skips by tier.
  prune-caches:
    name: Prune caches
    needs: ci-ok
    if: ${{ !cancelled() && needs.ci-ok.result == 'success' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Delete superseded cache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/prune-caches.sh
