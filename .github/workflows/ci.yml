name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Per-rule lint severity is set by `[workspace.lints]` in the root
  # Cargo.toml. We intentionally do not set `RUSTFLAGS=-Dwarnings`
  # here — that would override `missing_docs = "warn"` and turn the
  # 3,335 known warnings into errors. Things we *do* want as errors
  # (`unsafe_code`, `unused_must_use`, `clippy::todo`, etc.) are
  # already `deny` in the workspace lints.

permissions:
  contents: write
  id-token: write

# =============================================================================
# Tier 1 — CI
#
# Two tiers of jobs share the triggers (PRs to main/dev, push to main, v* tags):
#   Lean  — every PR (incl. feature→dev), push to main, v* tags.
#           Fast gate: fmt, clippy, file-size, no-secret, Linux test.
#   Heavy — skips feature→dev PRs; runs on dev→main PRs, push to main, v* tags.
#           Cross-OS tests, MSRV, cargo-audit, cargo-deny.
# This keeps the high-throughput feature→dev loop fast while the dev→main
# gate (and the tag/push-main release gate) run the full matrix before merge.
#
# Guard cheat-sheet (the `if:` on each job is one of these two):
#   lean : github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
#   heavy: github.event_name == 'push' || github.base_ref == 'main'
# =============================================================================

jobs:
  # Defense in depth with the top-level trigger: PRs run on main/dev,
  # but merge pushes to dev must not spend CI if push filters change later.
  fmt:
    name: Rustfmt
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude rusty-bacnet --all-targets --locked

  audit:
    name: Cargo Audit
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: advisory-db-${{ runner.os }}-
      - run: cargo audit --color always

  file-size-cap:
    name: File-size cap (700 LOC)
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-file-size.sh

  no-secret-scan:
    name: No-secret scan
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-no-secrets.sh

  msrv:
    name: MSRV (1.93)
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    env:
      # Override `rust-toolchain.toml` (which pins the dev/CI channel to
      # 1.97.1) so this job exercises the documented MSRV from the
      # workspace `Cargo.toml`.
      RUSTUP_TOOLCHAIN: "1.93"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # Derives the publishable crates from cargo metadata and checks them with
      # the optional features a consumer can enable. See the script for why the
      # list is derived rather than written down.
      - run: bash .github/scripts/check-msrv.sh

  test:
    name: Test (${{ matrix.os }})
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux only in the lean tier: the full-feature suite (serial +
          # ethernet are Linux-only deps). macOS/Windows run in `test-cross`
          # below, gated to dev→main PRs / push-main / tags so the
          # feature→dev loop isn't held up by cross-OS runners.
          - os: ubuntu-latest
            features: "--features bacnet-types/serde,bacnet-transport/ipv6,bacnet-transport/sc-tls,bacnet-transport/serial,bacnet-transport/ethernet"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          # Do not cache ~/.cargo/bin; a stale cache from an older runner
          # image can clobber rustup's shims after dtolnay installs them,
          # causing `cargo test` to invoke a broken `rustup-init`. This
          # bit us on macos-15-arm64 image 20260511.0048 — see PR #21.
          cache-bin: false
      - run: cargo test --workspace --exclude rusty-bacnet --locked ${{ matrix.features }}

  test-cross:
    name: Test (${{ matrix.os }})
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-OS legs (macOS/Windows) — heavy tier, only on dev→main PRs,
          # push to main, and v* tags. Linux is already covered by `test`
          # above in the lean tier.
          - os: macos-latest
            features: "--features bacnet-types/serde,bacnet-transport/ipv6,bacnet-transport/sc-tls"
          - os: windows-latest
            features: "--features bacnet-types/serde,bacnet-transport/ipv6,bacnet-transport/sc-tls"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          cache-bin: false
      - run: cargo test --workspace --exclude rusty-bacnet --locked ${{ matrix.features }}

  deny:
    name: Cargo Deny
    if: ${{ github.event_name == 'push' || github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ===========================================================================
  # Tier 2 — Release (only on v* tags, after all CI passes)
  # ===========================================================================

  validate:
    name: Validate Release
    if: startsWith(github.ref, 'refs/tags/v')
    # Every Tier 1 job, listed in declaration order so the list can be audited
    # against the jobs above at a glance. A Tier 1 job omitted here still runs on
    # the tag and can still fail — it just stops gating the release, which is how
    # file-size-cap and msrv came to be missing.
    needs:
      [
        fmt,
        clippy,
        audit,
        file-size-cap,
        no-secret-scan,
        msrv,
        test,
        test-cross,
        deny,
      ]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract and validate version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing entry for version $VERSION"
            exit 1
          fi

  publish-crates:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2

      - name: Publish bacnet-types
        run: cargo publish -p bacnet-types --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30

      - name: Publish bacnet-encoding
        run: cargo publish -p bacnet-encoding --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30

      - name: Publish bacnet-services
        run: cargo publish -p bacnet-services --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30

      - name: Publish bacnet-transport
        run: cargo publish -p bacnet-transport --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30

      - name: Publish bacnet-network
        run: cargo publish -p bacnet-network --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30

      - name: Publish bacnet-objects
        run: cargo publish -p bacnet-objects --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30

      - name: Publish bacnet-server
        run: cargo publish -p bacnet-server --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30

      - name: Publish bacnet-client
        run: cargo publish -p bacnet-client --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-wheels:
    name: Wheels (${{ matrix.os }} ${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m crates/rusty-bacnet/Cargo.toml -i 3.11 3.12 3.13
          manylinux: auto
          sccache: true
          before-script-linux: |
            if command -v yum &> /dev/null; then
              yum install -y perl-IPC-Cmd cmake3 || true
              ln -sf /usr/bin/cmake3 /usr/local/bin/cmake || true
            elif command -v apk &> /dev/null; then
              apk add --no-cache cmake perl make
            fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  build-sdist:
    name: Build sdist
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/rusty-bacnet/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-crates, publish-pypi, build-cli-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/cli/bacnet-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Tier 2c — CLI binary distribution
  # ===========================================================================

  build-cli-binaries:
    name: CLI Binary (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: bacnet-linux-amd64
            features: "pcap,sc-tls"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: bacnet-linux-arm64
            features: "pcap,sc-tls"
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: bacnet-macos-amd64
            features: "sc-tls"
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: bacnet-macos-arm64
            features: "sc-tls"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: bacnet-windows-amd64.exe
            features: "sc-tls"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build CLI
        run: cargo build --release -p bacnet-cli --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Rename binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/bacnet"
          if [ "${{ runner.os }}" = "Windows" ]; then
            src="${src}.exe"
          fi
          cp "$src" "${{ matrix.binary }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ matrix.binary }}

  # ===========================================================================
  # Docker Hub (placeholder for 1.0)
  # ===========================================================================
  # TODO: Add multi-arch Docker builds for:
  #   - bacnet-device (BIP/SC server)
  #   - bacnet-router (multi-port router)
  #   - bacnet-bbmd (broadcast management)
  #   - bacnet-sc-hub (SC hub relay)
  # Target: linux/amd64 + linux/arm64 via docker/build-push-action
