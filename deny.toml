[graph]
targets = []
all-features = false
no-default-features = false
exclude = ["bacnet-benchmarks"]

[advisories]
# See docs/ci.md for the release gate and both temporary maintenance exceptions.
ignore = [
    { id = "RUSTSEC-2026-0543", allow = ["rmcp@3.9.0", "schemars@1.2.2"], expiry = "2026-12-19", reason = "Released MCP SDK versions require chrono pending https://github.com/modelcontextprotocol/rust-sdk/pull/1474" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
]
exceptions = [
    { allow = ["OpenSSL"], crate = "aws-lc-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
