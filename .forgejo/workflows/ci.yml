name: CI

# Runs on the self-hosted Forgejo runner VM (Linux amd64 Spot VM): the build and
# test jobs in the main runner's three slots, and the seconds-long CI image and
# CI OK jobs on the same VM's gate runner (label `gate`, two slots), so a run
# doesn't wait for a slot before and after its real work. Jobs run in the
# prebuilt image from .forgejo/ci-image (the runner's act image plus the
# toolchains, tools and apt packages), which the "CI image" job builds and pushes
# to Forgejo's registry when its tag is missing (#904). The tests, clippy and
# rustdoc run natively on macOS and Windows on GitHub-hosted runners, from the
# push mirror, in .github/workflows/native-tests.yml (#950). See docs/ci.md.
#
#   Lean  — every PR to dev/main, push to dev/main, v* tags, weekly, manual:
#           lint (fmt, file-size cap, no-secret scan, script regressions,
#           changelog fragments),
#           clippy and rustdoc with warnings denied (every feature, the PyO3
#           crate, and each published crate alone with default features, for
#           Linux, Windows and macOS; the every-feature and PyO3 rustdoc runs
#           include private items),
#           every-feature Linux tests plus bacnet-cli's feature-off tests,
#           and the Python bindings built with maturin, their unittest suite
#           and the PyO3 crate's own Rust tests.
#   Heavy — PRs to main, push to main, v* tags, weekly schedule, manual:
#           MSRV (Linux native, incl. optional features and pcap link), audit, deny.
#   CI OK — single required status that fails if any job above failed.
#
# Pushes to dev (PR merges) run the Lean jobs so their caches are written from a
# non-PR event, which every new PR's first run can restore (PR-event cache
# writes are scoped to that PR), and so the merge result itself is tested (#904).

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]
    tags: ["v*"]
  schedule:
    # Advisory databases change without code changes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  # Per event and ref: a scheduled or manual run never cancels a push to main,
  # PR runs and dev-merge runs never cancel each other, and a newer merge to dev
  # cancels the previous merge's run (the newer one tests a superset).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds are from scratch or a restored cache; incremental state is dead weight.
  CARGO_INCREMENTAL: "0"
  # Test binaries without native debug info: less codegen, linking and cache.
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Tag = first 12 hex digits of sha256(.forgejo/ci-image/Dockerfile). The image
  # carries the toolchains; the "CI image" job checks they match the repo's pins.
  CI_IMAGE: forgejo.taile9ca5.ts.net/jscott3201/rusty-bacnet-ci:45c95fae1133
  # Every optional feature that builds on Linux, including per-crate features
  # such as bacnet-endpoint/sc-tls and bacnet-cli/{sc-tls,pcap} that nothing
  # else in the workspace turns on (#906). bacnet-benchmarks/console is left
  # out: it needs tokio_unstable.
  LINUX_FEATURES: bacnet-types/serde,bacnet-transport/ipv6,bacnet-transport/sc-tls,bacnet-transport/serial,bacnet-transport/serial-gpio,bacnet-transport/ethernet,bacnet-client/ipv6,bacnet-client/sc-tls,bacnet-server/sc-tls,bacnet-endpoint/sc-tls,bacnet-integration-tests/ipv6,bacnet-integration-tests/ethernet,bacnet-cli/sc-tls,bacnet-cli/pcap

jobs:
  # Builds and pushes CI_IMAGE only when that tag is not in the registry yet, so
  # a PR that changes the Dockerfile (and therefore the tag) tests its own image.
  # Runs in host mode on the gate runner, which shares the VM's Docker with the
  # main runner, so the pull below reaches the job containers that follow.
  image:
    name: CI image
    runs-on: gate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag and toolchain pins
        run: |
          dir=.forgejo/ci-image
          # The tag hashes only the Dockerfile, so nothing else may feed the build.
          test "$(ls -A "$dir")" = Dockerfile || { echo "::error::$dir must hold only the Dockerfile"; exit 1; }
          want=$(sha256sum "$dir/Dockerfile" | cut -c1-12)
          test "${CI_IMAGE##*:}" = "$want" || { echo "::error::set CI_IMAGE's tag to $want"; exit 1; }
          grep -qxF "  CI_IMAGE: $CI_IMAGE" .forgejo/workflows/release.yml \
            || { echo "::error::set CI_IMAGE in release.yml to $CI_IMAGE too"; exit 1; }
          arg() { sed -n "s/^ARG $1=//p" "$dir/Dockerfile"; }
          toolchain=$(arg RUST_TOOLCHAIN) msrv=$(arg RUST_MSRV)
          channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          rust_version=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          fail=0
          [ "$channel" = "$toolchain" ] || { echo "::error::rust-toolchain.toml has $channel, the image $toolchain"; fail=1; }
          [ "$rust_version" = "$msrv" ] || { echo "::error::Cargo.toml rust-version is $rust_version, the image's MSRV $msrv"; fail=1; }
          grep -q "RUSTUP_TOOLCHAIN: \"$msrv\"" .forgejo/workflows/ci.yml \
            || { echo "::error::the MSRV job's RUSTUP_TOOLCHAIN is not $msrv"; fail=1; }
          exit $fail
      # The automatic job token can't write packages, so pushes use a personal
      # access token with package read/write scope, stored as this secret. The
      # registry also needs sign-in to pull, and job containers never pull
      # (force_pull: false), so an existing tag is pulled here into the VM's
      # Docker for the jobs that follow.
      - name: Pull, or build and push if the tag is missing
        env:
          REGISTRY_TOKEN: ${{ secrets.CI_IMAGE_TOKEN }}
          REGISTRY_USER: ${{ github.repository_owner }}
        run: |
          registry=${CI_IMAGE%%/*}
          # Under RUNNER_TEMP, which the runner deletes even if the job is killed.
          export DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/docker-config.XXXXXX")
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          echo "$REGISTRY_TOKEN" | docker login "$registry" -u "$REGISTRY_USER" --password-stdin
          if err=$(docker manifest inspect "$CI_IMAGE" 2>&1 >/dev/null); then
            docker pull -q "$CI_IMAGE"
            exit 0
          fi
          grep -qiE 'no such manifest|manifest unknown|not found' <<<"$err" \
            || { echo "::error::cannot query $CI_IMAGE: $err"; exit 1; }
          docker build --pull -t "$CI_IMAGE" .forgejo/ci-image
          docker push "$CI_IMAGE"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: image
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: File-size cap (700 LOC)
        run: bash scripts/ci/check-file-size.sh
      - name: No-secret scan
        run: |
          bash scripts/ci/test-check-no-secrets.sh
          bash scripts/ci/check-no-secrets.sh
      - name: MSRV script regressions
        run: python3 scripts/ci/test-check-msrv.py
      - name: Release script tests
        run: python3 -m unittest discover -s scripts/release
      # Entries are changelog.d/ fragments; [Unreleased] in CHANGELOG.md holds none.
      - name: Changelog fragments
        run: |
          python3 -m unittest discover -s scripts -p 'test_changelog.py'
          python3 scripts/changelog.py check
      - name: Conformance ledger script tests
        run: python3 -m unittest discover -s scripts -p 'test_ledger_*.py'

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: image
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 45
    env:
      # The per-crate default-features check runs for these targets (#981):
      # Windows and macOS compile different code behind their platform cfgs.
      # The image has their standard libraries for the release builds. In the
      # cache key, so a change restarts the cache with their dependencies.
      DEFAULT_FEATURES_TARGETS: x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          cache-bin: false
          cache-on-failure: true
          env-vars: LINUX_FEATURES DEFAULT_FEATURES_TARGETS
      # Warnings are errors for workspace code only; dependencies are unaffected.
      - name: Clippy (every feature)
        run: cargo clippy --workspace --exclude rusty-bacnet --all-targets --locked --features "$LINUX_FEATURES" -- -D warnings
      # !cancelled(): report every configuration, not just the first failure.
      - name: Clippy (PyO3 bindings)
        if: ${{ !cancelled() }}
        run: cargo clippy -p rusty-bacnet --all-targets --locked -- -D warnings
      # bacnet-cli without its default `tui` feature, which every other run turns on.
      - name: Clippy (bacnet-cli, no default features)
        if: ${{ !cancelled() }}
        run: cargo clippy -p bacnet-cli --no-default-features --all-targets --locked -- -D warnings
      # One cargo run per crate checks the targets side by side, which costs a
      # few seconds more than Linux alone did.
      - name: Clippy and rustdoc (each published crate, default features; no_std bacnet-types; Linux, Windows, macOS)
        if: ${{ !cancelled() }}
        run: |
          # shellcheck disable=SC2086 # one argument per target
          bash scripts/ci/check-default-features.sh $DEFAULT_FEATURES_TARGETS
      # Private and pub(crate) items too, so their intra-doc links can't rot
      # (#1164). This run still flags public docs that link to private items
      # (rustdoc::private_intra_doc_links), so it replaces the public-only run.
      - name: Rustdoc (every feature, private items)
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --exclude rusty-bacnet --no-deps --locked --document-private-items --features "$LINUX_FEATURES"
      # Every module of the PyO3 crate is private, so only this run checks its docs.
      - name: Rustdoc (PyO3 bindings, private items)
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p rusty-bacnet --no-deps --locked --document-private-items

  test:
    name: Test (Linux, full features)
    runs-on: ubuntu-latest
    needs: image
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          cache-bin: false
          cache-on-failure: true
          env-vars: LINUX_FEATURES
      # nextest runs each test in its own process (.config/nextest.toml);
      # it does not run doctests, so cargo test --doc covers those.
      - run: cargo nextest run --workspace --exclude rusty-bacnet --locked --features "$LINUX_FEATURES" --profile ci
      - run: cargo test --doc --workspace --exclude rusty-bacnet --locked --features "$LINUX_FEATURES"
      # Tests that exist only with a feature off (the CLI's rebuild advice for
      # sc-tls and pcap); LINUX_FEATURES compiles them out.
      - name: bacnet-cli tests (default features)
        run: cargo nextest run -p bacnet-cli --locked --profile ci
      # And with the default `tui` feature off too, where `bacnet tui` prints
      # rebuild advice instead.
      - name: bacnet-cli tests (no default features)
        if: ${{ !cancelled() }}
        run: cargo nextest run -p bacnet-cli --no-default-features --locked --profile ci

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    needs: image
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: python
          cache-bin: false
          cache-on-failure: true
      # A debug extension builds faster, and the suite doesn't need release speed.
      - name: Build the extension (maturin develop)
        run: |
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          python --version
          maturin develop -m crates/rusty-bacnet/Cargo.toml --locked
      - name: Python tests
        run: |
          . /tmp/venv/bin/activate
          python -m unittest discover -s crates/rusty-bacnet/tests
      # The crate's lib unit tests and integration tests, linked against libpython
      # (#919). PYO3_PYTHON pins the image's apt python3, which libpython3-dev matches;
      # pyo3 would otherwise try `python` on PATH first. Not using the venv keeps
      # this step independent of the maturin build.
      - name: Rust tests
        if: ${{ !cancelled() }}
        env:
          PYO3_PYTHON: /usr/bin/python3
        run: cargo nextest run -p rusty-bacnet --locked --profile ci

  msrv:
    name: MSRV (Linux native)
    # Skip PRs to dev and dev merges; any other event (main, tags, schedule on
    # dev, manual, or a trigger added later) runs it.
    if: ${{ (github.event_name != 'pull_request' || github.base_ref == 'main') && !(github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    needs: image
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 45
    env:
      # Overrides rust-toolchain.toml so the documented MSRV is what compiles.
      # The "CI image" job checks it matches the image's MSRV and Cargo.toml.
      RUSTUP_TOOLCHAIN: "1.93"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
          cache-bin: false
          cache-on-failure: true
      # Publishable crates with consumer-visible features, then the ethernet,
      # serial and serial-gpio transport checks and a linked bacnet-cli pcap build.
      - run: bash scripts/ci/check-msrv.sh --linux-native

  audit-deny:
    name: Cargo Audit + Deny
    # Skip PRs to dev and dev merges; any other event (main, tags, schedule on
    # dev, manual, or a trigger added later) runs it.
    if: ${{ (github.event_name != 'pull_request' || github.base_ref == 'main') && !(github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    needs: image
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cargo Audit
        run: cargo audit --color always
      - name: Cargo Deny
        if: ${{ !cancelled() }}
        run: cargo deny --all-features check

  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs: [image, lint, clippy, test, python, msrv, audit-deny]
    # Host mode on the gate runner: the VM's jq does the check.
    runs-on: gate
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded or were skipped by tier
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
