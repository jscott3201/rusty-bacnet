# cargo-nextest settings. nextest is this workspace's test runner: every test
# runs in its own process. It does not run doctests; `cargo test --doc` does.
# Reference: https://nexte.st/docs/configuration/

# Before 0.9.145, nextest on macOS could hand a test process a sibling test's
# half-created capture pipe, so unrelated passing tests showed as leaky (#751).
nextest-version = { recommended = "0.9.145" }

[profile.default]
# Flag a test after 30 s and stop it after 2 min as a timeout failure, so a
# hang is reported by name instead of stalling the run.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
# Report every failure in one run, repeat failure output at the end, and list
# slow, skipped and leaky tests in the summary.
fail-fast = false
failure-output = "immediate-final"
final-status-level = "leak"

# The B/IP broadcast observers bind an ephemeral port with SO_REUSEADDR so the
# node under test can share it. On Linux, two such sockets in concurrent test
# processes can be handed the same port, and each test then reads the other's
# broadcasts (a Network-Number-Is 77 seen where 78 was expected). Run every
# test that uses an observer one at a time.
[test-groups]
bip-broadcast-observers = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(bip_network_numbers) | binary(client_bip_network_numbers)'
test-group = 'bip-broadcast-observers'

# The MS/TP dedicated-thread smoke tests on the wall clock (rb17's and
# mstp_network_numbers') run their node on a thread of its own, on that
# runtime's time, beside the test's thread. Under heavy load a node starved
# past a deadline (the 250 ms reply window, T_no_token) rightly drops or
# misses a frame, and the test fails (#2269, #2277; the rb17 signature is in
# tests/support/rb17_harness.rs). Count each as two threads, so a loaded run
# starts fewer tests beside them. The other dedicated variants run on the
# test's paused time and need no override (#2284).
[[profile.default.overrides]]
filter = '(binary_id(bacnet-endpoint::rb17_mstp_flows) | binary_id(bacnet-endpoint::rb17_mstp_proof) | binary_id(bacnet-endpoint::rb17_mstp_extended) | binary_id(bacnet-endpoint::mstp_network_numbers)) & test(/_wall_clock$/)'
threads-required = 2

# These B/IP broadcast tests skip themselves on a host without a usable
# default route or broadcast; show their output when they pass, so a CI log
# says whether each one ran or skipped (#1538).
[[profile.default.overrides]]
filter = '''
    binary_id(bacnet-transport) & (
        test(=bip::shared_port_tests::a_subnet_broadcast_reaches_a_transport_sharing_its_port_by_address)
      | test(=bip::shared_port_tests::a_broadcast_from_another_interface_is_dropped)
    )
'''
success-output = "immediate"

# The firmware link test's RAM sizes on the host (#1626, #1664, #1667), for
# the log; check-firmware-link.sh prints the bare-metal ones. Likewise each
# scenario's peak heap use against its image's arena (#1635, #2178, #2303),
# and the points scenario's list, build and database (#2445).
[[profile.default.overrides]]
filter = '''
    (package(firmware-link) & (test(=ram_sizes) | test(=heap_fits_the_arena)))
'''
success-output = "immediate"

# Start the slowest tests first. nextest otherwise starts tests in binary and
# name order, so a long test in a binary that sorts late, such as
# bacnet-transport, starts near the end and keeps the run going alone for most
# of its length. Started first, they finish while short tests fill the other
# threads. Custom profiles such as `ci` apply these default-profile overrides
# too.
#
# The list names every test that took 3.5 s or more in recent runs of CI's
# Linux test job, "Test (Linux, full features)", exactly, so no new test joins
# it by accident. A slow test missing from it, or one renamed, costs wall time
# only. To refresh it, take the slow PASS lines from that job's log and update
# the names below. The job ID ends the job's URL; gh prints the log's colour
# codes as text, which the sed removes:
#
#   gh run view -R jscott3201/rusty-bacnet --job <job id> --log \
#     | sed 's/\^\[\[[0-9;]*m//g' | grep -E 'PASS \[ +([0-9]{2,}\.|[4-9]\.|3\.[5-9])'
[[profile.default.overrides]]
filter = '''
    (binary_id(bacnet-client) & (
        test(=client::tests::confirmed_request_timeout)
      | test(=client::routed_path_limit_tests::routed_sizing_uses_conservative_and_configured_forwarded_envelopes)
    ))
  | (binary_id(bacnet-server) & (
        test(=server::audit_reporter_tests::lifecycle::audit_reporter_unassigned_create_failures_never_invent_an_oid)
      | test(=server::audit_reporter_tests::read::range_file::boundary::audit_reporter_range_file_guard_release_precedes_admission_not_delivery)
      | test(=server::audit_reporter_tests::read::boundary::audit_reporter_read_admission_waits_for_read_guard_release_not_delivery)
    ))
  | (binary_id(bacnet-transport) & (
        test(=sc_tls::node_tls_tests::rejection_deadline_tests::rejection_deadline_tls_write_lock_cancels_control_nak_without_later_flush)
      | test(=sc_tls::node_tls_tests::rejection_deadline_tests::rejection_deadline_tls_write_lock_cancels_source_nak_without_later_flush)
      | test(=sc_tls::node_tls_tests::rejection_deadline_tests::rejection_deadline_tls_write_lock_cancels_must_understand_nak_without_later_flush)
      | test(=sc_tls::node_tls_tests::rejection_deadline_tests::rejection_deadline_tls_write_lock_cancels_empty_npdu_nak_without_later_flush)
      | test(=sc_tls::node_tls_tests::rejection_deadline_tests::rejection_deadline_tls_write_lock_cancels_unknown_function_nak_without_later_flush)
      | test(=sc_hub::graceful_tests::graceful_does_not_block_on_held_sink)
      | test(=sc_hub::retirement_capacity_tests::terminal_relays_and_peer_close_each_recover_beyond_512_connections)
      | test(=sc_hub::retirement_capacity_tests::replacement_and_heartbeat_retirement_each_recover_beyond_512_blocked_relays)
    ))
  | (binary_id(bacnet-transport::sc_hub_tls) & test(=typed_hub_honors_each_timeout_and_preserves_established_peers))
'''
priority = 100
