<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" role="img" aria-labelledby="title desc"><title id="title">Transport shapes, not interchangeable configuration</title><desc id="desc">Three separate topology sketches: BACnet/IP client to IP device; BACnet/SC node through a hub to another node; and an MS/TP station with a serial adapter on an RS485 trunk. These are alternatives, not an automatic gateway.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#bb7955" stroke-width="1.3"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.t{fill:#eff0e9;font-size:20px;font-weight:600}.s{fill:#b7c4be;font-size:15px}.k{fill:#eab696;font-size:13px;letter-spacing:1.5px;font-weight:600}.line{fill:none;stroke:#bb7955;stroke-width:2;marker-end:url(#arrow)}.box{fill:#21312e;stroke:#496159;stroke-width:1}</style>
<rect width="980" height="480" rx="20" fill="#182923"/><text x="32" y="44" class="k">CHOOSE A TRANSPORT, THEN CHECK ITS INTERFACE</text>
<text x="34" y="106" class="t">BACnet/IP</text><text x="34" y="132" class="s">UDP / IPv4</text>
<rect x="255" y="80" width="180" height="60" rx="10" class="box"/><text x="345" y="116" text-anchor="middle" class="t">Client</text><path d="M447 110h265" class="line"/>
<rect x="728" y="80" width="216" height="60" rx="10" class="box"/><text x="836" y="116" text-anchor="middle" class="t">IP device</text>
<path d="M32 170h916" stroke="#385448"/>
<text x="34" y="228" class="t">BACnet/SC</text><text x="34" y="254" class="s">WebSocket + TLS</text>
<rect x="255" y="202" width="150" height="60" rx="10" class="box"/><text x="330" y="238" text-anchor="middle" class="t">SC node</text><path d="M417 232h83" class="line"/>
<rect x="515" y="202" width="150" height="60" rx="10" class="box"/><text x="590" y="238" text-anchor="middle" class="t">SC hub</text><path d="M677 232h76" class="line"/>
<rect x="768" y="202" width="176" height="60" rx="10" class="box"/><text x="856" y="238" text-anchor="middle" class="t">SC node</text>
<path d="M32 292h916" stroke="#385448"/>
<text x="34" y="350" class="t">MS/TP</text><text x="34" y="376" class="s">RS-485 trunk</text>
<rect x="255" y="324" width="160" height="60" rx="10" class="box"/><text x="335" y="360" text-anchor="middle" class="t">Station</text><path d="M428 354h63" class="line"/>
<rect x="506" y="324" width="160" height="60" rx="10" class="box"/><text x="586" y="360" text-anchor="middle" class="t">Serial adapter</text><path d="M679 354h70" class="line"/>
<rect x="764" y="324" width="180" height="60" rx="10" class="box"/><text x="854" y="360" text-anchor="middle" class="t">Field devices</text>
<text x="32" y="446" class="s">Separate examples. Not a claim of automatic routing, uniform platform support, or certification.</text></svg>
