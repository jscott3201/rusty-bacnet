<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="title desc"><title id="title">MS/TP timing crosses hardware and software boundaries</title><desc id="desc">Qualification must follow timing from the Linux application through its scheduler, serial driver and adapter to the actual RS485 wire. Efficient protocol code alone does not establish wire timing compliance.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#bb7955" stroke-width="1.3"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.t{fill:#eff0e9;font-size:20px;font-weight:600}.s{fill:#b7c4be;font-size:15px}.k{fill:#eab696;font-size:13px;letter-spacing:1.5px;font-weight:600}.line{fill:none;stroke:#bb7955;stroke-width:2;marker-end:url(#arrow)}.box{fill:#21312e;stroke:#496159;stroke-width:1}</style>
<rect width="980" height="440" rx="20" fill="#182923"/><text x="32" y="44" class="k">THE WIRE IS THE FINAL MEASUREMENT POINT</text>
<rect x="35" y="92" width="240" height="168" rx="12" class="box"/><text x="57" y="128" class="k">01 / HOST</text><text x="57" y="164" class="t">Protocol + scheduler</text><text x="57" y="195" class="s">Processing and wake-up delay</text><text x="57" y="221" class="s">Change under system load</text>
<path d="M289 176h36" class="line"/>
<rect x="340" y="92" width="300" height="168" rx="12" class="box"/><text x="362" y="128" class="k">02 / SERIAL PATH</text><text x="362" y="164" class="t">Driver + adapter</text><text x="362" y="195" class="s">Buffering and USB delivery</text><text x="362" y="221" class="s">Transmit-direction behavior</text>
<path d="M654 176h36" class="line"/>
<rect x="705" y="92" width="240" height="168" rx="12" class="box"/><text x="727" y="128" class="k">03 / BUS</text><text x="727" y="164" class="t">RS-485 wire</text><text x="727" y="195" class="s">Observe receive → transmit</text><text x="727" y="221" class="s">Use independent capture</text>
<rect x="35" y="296" width="910" height="86" rx="12" fill="#2b4034" stroke="#56715f"/><text x="57" y="331" class="t">Qualify the actual deployment, not just the state machine.</text><text x="57" y="359" class="s">Adapter, baud rate, driver, operating system, and representative workload all matter.</text>
<text x="35" y="413" class="s">This is a timing-boundary diagram, not a wiring guide or a claim that a real-time OS is always required.</text></svg>
