<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="title desc"><title id="title">Discover, then read</title><desc id="desc">Within an authorized BACnet/IP network, a directed Who-Is receives an I-Am response. The client then sends a ReadProperty request and receives a value. A direct property read need not first perform discovery.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#bb7955" stroke-width="1.3"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.t{fill:#eff0e9;font-size:20px;font-weight:600}.s{fill:#b7c4be;font-size:15px}.k{fill:#eab696;font-size:13px;letter-spacing:1.5px;font-weight:600}.line{fill:none;stroke:#bb7955;stroke-width:2;marker-end:url(#arrow)}.box{fill:#21312e;stroke:#496159;stroke-width:1}</style>
<rect width="980" height="430" rx="20" fill="#182923"/><text x="32" y="44" class="k">TWO DIFFERENT QUESTIONS</text>
<rect x="50" y="78" width="210" height="62" rx="10" class="box"/><text x="155" y="116" text-anchor="middle" class="t">Your client</text>
<rect x="720" y="78" width="210" height="62" rx="10" class="box"/><text x="825" y="116" text-anchor="middle" class="t">Known IP target</text>
<path d="M155 140v230M825 140v230" stroke="#587466" stroke-dasharray="5 7"/>
<path d="M170 178h640" class="line"/><text x="490" y="165" text-anchor="middle" class="t">Who-Is · identify a device</text>
<path d="M810 222H170" class="line"/><text x="490" y="210" text-anchor="middle" class="s">I-Am · device identity and capabilities</text>
<path d="M170 290h640" class="line"/><text x="490" y="277" text-anchor="middle" class="t">ReadProperty · ask for a property</text>
<path d="M810 334H170" class="line"/><text x="490" y="322" text-anchor="middle" class="s">Reply · typed value or protocol error</text>
<text x="32" y="404" class="s">Directed requests are not broadcasts. Knowing the target lets you read without discovery.</text></svg>
