<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">A directed read on one machine</title><desc id="desc">A Python client and example BACnet server use separate UDP ports on 127.0.0.1. The client reads analog input 1 present value and receives real 72.5. Both endpoints then stop.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30443a" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 8 4.5 1 8" fill="none" stroke="#eead81" stroke-width="1.3"/></marker></defs>
<rect width="960" height="430" rx="20" fill="#182923"/><rect width="960" height="430" rx="20" fill="url(#grid)"/>
<g font-family="system-ui, sans-serif"><text x="40" y="48" fill="#eead81" font-size="14" letter-spacing="2">LOCAL LEARNING LAB</text><text x="40" y="87" fill="#eff0e9" font-size="26" font-weight="600">One machine. Two sockets. One property read.</text>
<rect x="40" y="129" width="265" height="165" rx="13" fill="#243c31" stroke="#496154"/><text x="64" y="166" fill="#eff0e9" font-size="22" font-weight="600">Python client</text><text x="64" y="204" fill="#c3d0c6" font-size="17">127.0.0.1</text><text x="64" y="234" fill="#c3d0c6" font-size="16">Local port: auto-assigned</text><text x="64" y="269" fill="#eead81" font-size="16">ReadProperty → ai:1 / pv</text>
<rect x="655" y="129" width="265" height="165" rx="13" fill="#243c31" stroke="#496154"/><text x="679" y="166" fill="#eff0e9" font-size="22" font-weight="600">Example server</text><text x="679" y="204" fill="#c3d0c6" font-size="17">127.0.0.1</text><text x="679" y="234" fill="#c3d0c6" font-size="16">Server port: auto-assigned</text><text x="679" y="269" fill="#eead81" font-size="16">Analog input 1</text>
<path d="M325 183H635" fill="none" stroke="#eead81" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="164" text-anchor="middle" fill="#eff0e9" font-size="16">Directed request</text>
<path d="M635 242H325" fill="none" stroke="#eead81" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="275" text-anchor="middle" fill="#c2dcb7" font-size="20" font-weight="600">real: 72.5</text>
<rect x="40" y="327" width="880" height="61" rx="10" fill="#101e19" stroke="#496154"/><text x="480" y="365" text-anchor="middle" fill="#c3d0c6" font-size="17">Loopback only · No discovery or remote writes · Clean shutdown</text>
</g></svg>
