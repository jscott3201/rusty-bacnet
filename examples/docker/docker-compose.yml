# BACnet stress test topology.
#
# 6 networks:
#   bacnet-a    172.20.0.0/24   BIP subnet A
#   bacnet-b    172.20.1.0/24   BIP subnet B
#   bacnet-ipv6 fd00:bacnet::/64  BIP6 subnet
#   bacnet-sc   172.20.3.0/24   SC hub + devices
#   foreign     172.20.4.0/24   Foreign device subnet, joined to subnet A
#                               by the ip-router service (an IP router)
#   discovery   172.20.5.0/24   A fleet of devices on one broadcast domain
#
# Usage:
#   Provision caller-owned PEM credentials first; see README.md.
#   docker compose build
#   docker compose up -d
#   docker compose logs orchestrator
#   # The foreign-device scenario, after the orchestrator has finished:
#   docker compose run --rm foreign-bench
#   docker compose down
#
# foreign-bench is in the `foreign` profile, so a plain `up` doesn't run it
# alongside the orchestrator; `run` (or `--profile foreign`) starts it.
#
# Docker doesn't route IP between bridge networks. The foreign-device
# scenario needs it, so ip-router forwards between foreign and bacnet-a, and
# the hosts on its path add routes through it at start (net-entrypoint.sh,
# which needs NET_ADMIN).

services:

  # ── BIP Subnet A ─────────────────────────────────────────────────────────
  server-a:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    entrypoint: [bacnet-net]
    cap_add: [NET_ADMIN]
    environment:
      BACNET_ROUTES: 172.20.4.0/24 via 172.20.0.3
    command:
      - bacnet-device
      - --transport=bip
      - --interface=172.20.0.10
      - --port=47808
      - --broadcast=172.20.0.255
      - --device-instance=1000
      - --objects=1000
    networks:
      bacnet-a:
        ipv4_address: 172.20.0.10

  bbmd-a:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    entrypoint: [bacnet-net]
    cap_add: [NET_ADMIN]
    environment:
      BACNET_ROUTES: 172.20.4.0/24 via 172.20.0.3
    command:
      - bacnet-bbmd
      - --interface=172.20.0.2
      - --port=47808
      - --broadcast=172.20.0.255
      - --bdt=172.20.1.2:47808
      - --device-instance=9000
    networks:
      bacnet-a:
        ipv4_address: 172.20.0.2

  # ── BIP Subnet B ─────────────────────────────────────────────────────────
  server-b:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    command:
      - bacnet-device
      - --transport=bip
      - --interface=172.20.1.10
      - --port=47808
      - --broadcast=172.20.1.255
      - --device-instance=2000
      - --objects=1000
    networks:
      bacnet-b:
        ipv4_address: 172.20.1.10

  bbmd-b:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    command:
      - bacnet-bbmd
      - --interface=172.20.1.2
      - --port=47808
      - --broadcast=172.20.1.255
      - --bdt=172.20.0.2:47808
      - --device-instance=9001
    networks:
      bacnet-b:
        ipv4_address: 172.20.1.2

  # ── Router (spans subnets A, B, and IPv6) ────────────────────────────────
  router:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    command:
      - bacnet-router
      - --ports=bip:172.20.0.1:47808:172.20.0.255:1,bip:172.20.1.1:47808:172.20.1.255:2
    networks:
      bacnet-a:
        ipv4_address: 172.20.0.1
      bacnet-b:
        ipv4_address: 172.20.1.1

  # ── BACnet/SC ────────────────────────────────────────────────────────────
  sc-hub:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    command:
      - bacnet-sc-hub
      - --listen=0.0.0.0:47809
      - --ca=/run/bacnet-sc/ca.pem
      - --cert=/run/bacnet-sc/cert.pem
      - --key=/run/bacnet-sc/key.pem
      # Stable TEST-ONLY hosting device identity. Provision your own for deployment.
      - --device-uuid=9a21f1641a15454d9ed7e3a2710d7001
      - --vmac=000000000001
    volumes:
      - type: bind
        source: ${SC_CERT_DIR:-./sc-certs}/ca.pem
        target: /run/bacnet-sc/ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SC_CERT_DIR:-./sc-certs}/hub/cert.pem
        target: /run/bacnet-sc/cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SC_CERT_DIR:-./sc-certs}/hub/key.pem
        target: /run/bacnet-sc/key.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "nc -w 1 127.0.0.1 47809 < /dev/null"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      bacnet-sc:
        ipv4_address: 172.20.3.2

  sc-server:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    command:
      - bacnet-device
      - --transport=sc
      - --sc-hub=wss://172.20.3.2:47809
      - --device-instance=5000
      - --objects=500
      - --sc-ca=/run/bacnet-sc/ca.pem
      - --sc-cert=/run/bacnet-sc/cert.pem
      - --sc-key=/run/bacnet-sc/key.pem
      - --sc-vmac=020000001388
      - --sc-device-uuid=00000000000000000000000000001388
    volumes:
      - type: bind
        source: ${SC_CERT_DIR:-./sc-certs}/ca.pem
        target: /run/bacnet-sc/ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SC_CERT_DIR:-./sc-certs}/device/cert.pem
        target: /run/bacnet-sc/cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SC_CERT_DIR:-./sc-certs}/device/key.pem
        target: /run/bacnet-sc/key.pem
        read_only: true
        bind:
          create_host_path: false
    networks:
      bacnet-sc:
        ipv4_address: 172.20.3.10
    depends_on:
      sc-hub:
        condition: service_healthy

  # ── Foreign device subnet ────────────────────────────────────────────────
  # An IP router between the foreign subnet and subnet A, as a site's own
  # router would be.
  ip-router:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    command: [tail, -f, /dev/null]
    init: true
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      foreign:
        ipv4_address: 172.20.4.1
      bacnet-a:
        ipv4_address: 172.20.0.3

  # A foreign device on the foreign subnet only: it registers with bbmd-a,
  # finds server-a with a Who-Is the BBMD distributes, and reads from it.
  # Runs once and exits; only when asked for (the `foreign` profile).
  foreign-bench:
    profiles: [foreign]
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    entrypoint: [bacnet-net]
    cap_add: [NET_ADMIN]
    environment:
      BACNET_ROUTES: 172.20.0.0/24 via 172.20.4.1
    command:
      - stress-orchestrator
      - --wait-for-ready=10
      - --only=foreign
    networks:
      foreign:
        ipv4_address: 172.20.4.10
    depends_on:
      - server-a
      - bbmd-a
      - ip-router

  # ── Discovery fleet: devices on one broadcast domain ─────────────────────
  # Each replica takes its own address and, from it, its own Device instance
  # (100000 plus the address's low 16 bits). Scale with `--scale fleet=N`
  # and pass the orchestrator `--fleet N`.
  fleet:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    command:
      - bacnet-device
      - --transport=bip
      - --interface=auto
      - --port=47808
      - --broadcast=172.20.5.255
      - --device-instance=100000
      - --instance-from-address
      - --objects=10
    deploy:
      replicas: 20
    networks:
      - discovery

  # ── Orchestrator ─────────────────────────────────────────────────────────
  # Runs every scenario but the foreign-device one, which foreign-bench runs.
  orchestrator:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    command:
      - stress-orchestrator
      - --wait-for-ready=10
    networks:
      bacnet-a:
        ipv4_address: 172.20.0.100
      bacnet-b:
        ipv4_address: 172.20.1.100
      bacnet-sc:
        ipv4_address: 172.20.3.100
      discovery:
        ipv4_address: 172.20.5.100
    depends_on:
      - server-a
      - server-b
      - bbmd-a
      - bbmd-b
      - router
      - sc-hub
      - sc-server
      - fleet

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  bacnet-a:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.254

  bacnet-b:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24
          gateway: 172.20.1.254

  bacnet-ipv6:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:bacnet::/64

  bacnet-sc:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.3.0/24
          gateway: 172.20.3.254

  foreign:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.4.0/24
          gateway: 172.20.4.254

  discovery:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.5.0/24
          gateway: 172.20.5.254
