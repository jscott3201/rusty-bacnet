[package]
name = "mini-device-revisited"
version = "0.1.0"
edition = "2021"
description = "Rusty-BACnet port of BACpypes3 mini-device-revisited.py"
publish = false
default-run = "mini-device-revisited"

[dependencies]
bacnet-client = { path = "../../../../crates/bacnet-client" }
bacnet-encoding = { path = "../../../../crates/bacnet-encoding" }
bacnet-objects = { path = "../../../../crates/bacnet-objects" }
bacnet-server = { path = "../../../../crates/bacnet-server" }
bacnet-services = { path = "../../../../crates/bacnet-services" }
bacnet-transport = { path = "../../../../crates/bacnet-transport" }
bacnet-types = { path = "../../../../crates/bacnet-types" }
bytes = "1"
clap = { version = "4", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
