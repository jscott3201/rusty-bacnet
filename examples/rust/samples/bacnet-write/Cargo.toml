[package]
name = "bacnet-write"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Who-Is a device, WriteProperty present-value, read-back, optional relinquish"
license.workspace = true
publish = false

[[bin]]
name = "bacnet-write"
path = "src/main.rs"

[dependencies]
bacnet-client = { path = "../../../../crates/bacnet-client" }
bacnet-encoding = { path = "../../../../crates/bacnet-encoding" }
bacnet-services = { path = "../../../../crates/bacnet-services" }
bacnet-transport = { path = "../../../../crates/bacnet-transport" }
bacnet-types = { path = "../../../../crates/bacnet-types" }
bytes = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
